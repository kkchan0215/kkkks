<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이머 + 음성 읽기</title>

<style>
body{
    margin:0;
    background:#FFF7F0;
    font-family:"맑은 고딕",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:420px;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    margin-top:0;
    color:#ff7d7d;
}

#timer{
    font-size:70px;
    font-weight:bold;
    margin:20px 0;
}

button{
    margin:5px;
    padding:12px 18px;
    font-size:17px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.start{background:#77dd77;}
.pause{background:#ffd966;}
.reset{background:#ff8a8a;}
.speak{background:#87cefa;}
.stop{background:#c9c9c9;}

textarea{
    margin-top:20px;
    width:100%;
    height:100px;
    resize:none;
    border-radius:10px;
    border:2px solid #ddd;
    padding:10px;
    font-size:17px;
    box-sizing:border-box;
}

.slider{
    width:100%;
}
</style>
</head>

<body>

<div class="box">

<h1>⏱️ 타이머</h1>

<div id="timer">05:00</div>

<button class="start" onclick="startTimer()">▶ 시작</button>
<button class="pause" onclick="pauseTimer()">⏸ 일시정지</button>
<button class="reset" onclick="resetTimer()">🔄 초기화</button>

<hr>

<h2>🔊 음성 읽기</h2>

<textarea id="text" placeholder="읽을 내용을 입력하세요"></textarea>

<br><br>

속도
<input class="slider" type="range" min="0.5" max="1.5" value="0.9" step="0.1" id="speed">

<br><br>

<button class="speak" onclick="speak()">🔊 읽기</button>
<button class="stop" onclick="stopSpeak()">⏹ 정지</button>

</div>

<script>

let total=300;
let current=300;
let timer;

function update(){
    let m=Math.floor(current/60);
    let s=current%60;

    document.getElementById("timer").textContent=
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");
}

update();

function startTimer(){

    if(timer) return;

    timer=setInterval(()=>{

        if(current>0){
            current--;
            update();
        }else{

            clearInterval(timer);
            timer=null;

            alert("⏰ 시간이 종료되었습니다!");

            speakEnd();

        }

    },1000);

}

function pauseTimer(){
    clearInterval(timer);
    timer=null;
}

function resetTimer(){
    clearInterval(timer);
    timer=null;
    current=total;
    update();
}

function speak(){

    speechSynthesis.cancel();

    let txt=document.getElementById("text").value;

    if(txt.trim()=="") return;

    let utter=new SpeechSynthesisUtterance(txt);

    utter.lang="ko-KR";

    utter.rate=parseFloat(document.getElementById("speed").value);

    utter.pitch=1.1;

    utter.volume=1;

    let voices=speechSynthesis.getVoices();

    let female=voices.find(v=>
        v.name.includes("Heami")||
        v.name.includes("Yuna")||
        v.name.includes("Google 한국의")||
        v.name.includes("Female")||
        v.name.includes("Siri")
    );

    if(female) utter.voice=female;

    speechSynthesis.speak(utter);

}

function stopSpeak(){
    speechSynthesis.cancel();
}

function speakEnd(){

    speechSynthesis.cancel();

    let utter=new SpeechSynthesisUtterance("시간이 종료되었습니다.");

    utter.lang="ko-KR";
    utter.rate=0.9;
    utter.pitch=1.1;

    speechSynthesis.speak(utter);

}

speechSynthesis.onvoiceschanged=function(){};

document.getElementById("text").addEventListener("keydown",function(e){

    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        speak();
    }

});

</script>

</body>
</html>
