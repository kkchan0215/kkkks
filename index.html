
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상은행</title>
<style>
:root {
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#20243a;
  --muted:#858ba0;
  --primary:#6578ee;
  --line:#e8eaf3;
  --green:#19a77b;
  --red:#ed6374;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:active{transform:scale(.98)}
.hidden{display:none!important}
header{
  background:#fff;border-bottom:1px solid var(--line);
  padding:15px 18px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:5;
}
.logo{font-size:21px;font-weight:900;color:var(--primary)}
.header-right{display:flex;gap:8px;align-items:center}
.small-btn{
  background:#f0f2ff;color:var(--primary);border-radius:11px;
  padding:8px 11px;font-weight:800;font-size:13px;
}
main{max-width:900px;margin:0 auto;padding:20px 15px 45px}
.section-title{font-size:17px;font-weight:850;margin:23px 0 12px}
.person-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:13px 14px;
}
.arrow{
  width:38px;height:38px;border-radius:12px;
  background:#f0f2ff;color:var(--primary);font-size:20px;font-weight:900;
}
.person-name{font-size:16px;font-weight:850;text-align:center;flex:1}
.account-count{font-size:12px;color:var(--muted);margin-top:3px}
.card{
  border-radius:25px;padding:23px;color:#fff;
  background:linear-gradient(135deg,#687bf3,#8995fa 58%,#a7a5ff);
  box-shadow:0 12px 30px #6578ee2a;position:relative;overflow:hidden;
}
.card:after{
  content:"";position:absolute;width:210px;height:210px;border-radius:50%;
  right:-70px;top:-95px;background:#ffffff18;
}
.card:before{
  content:"";position:absolute;width:130px;height:130px;border-radius:50%;
  right:65px;bottom:-100px;background:#ffffff12;
}
.card-top,.card-bottom{position:relative;z-index:1}
.bank-line{display:flex;align-items:center;gap:9px;font-weight:850}
.bank-ball{width:15px;height:15px;border-radius:50%;display:inline-block;
  border:2px solid #ffffffa0;flex-shrink:0}
.owner{font-size:13px;color:#ffffffd9;margin-top:20px}
.account-number{font-size:clamp(17px,4.5vw,23px);font-weight:850;
  letter-spacing:1px;overflow-wrap:anywhere;word-break:break-word;margin-top:7px}
.balance-label{font-size:12px;color:#ffffffd9;margin-top:22px}
.balance{font-size:clamp(28px,7vw,36px);font-weight:900;margin-top:3px;overflow-wrap:anywhere}
.card-bottom{display:flex;justify-content:space-between;align-items:end;gap:10px}
.card-tag{font-size:11px;color:#ffffffd9}
.account-position{font-size:12px;color:#ffffffdf;white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.action{
  background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:15px 5px;font-size:13px;font-weight:800;color:var(--ink);
}
.action span{display:block;font-size:22px;margin-bottom:6px}
.action.primary{background:var(--primary);color:white;border-color:var(--primary)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:19px;font-weight:900;margin-top:6px;overflow-wrap:anywhere}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input,.field select,.search-input{
  width:100%;padding:12px;border:1px solid #dfe2ef;border-radius:11px;
  background:#fff;color:var(--ink);outline:none;min-width:0;
}
.field input:focus,.field select:focus,.search-input:focus{border-color:var(--primary)}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.btn{
  border-radius:12px;padding:12px 15px;font-weight:850;
  background:#eff1ff;color:var(--primary);
}
.btn.primary{background:var(--primary);color:white}
.btn.danger{background:#fff0f1;color:var(--red)}
.btn.dark{background:#34394f;color:#fff}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.history-list{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.history-item{display:flex;align-items:center;gap:11px;padding:12px;
  border:1px solid var(--line);border-radius:13px}
.history-icon{width:39px;height:39px;display:grid;place-items:center;
  border-radius:13px;background:#f1f2ff;font-size:18px;flex-shrink:0}
.history-main{flex:1;min-width:0}
.history-title{font-size:13px;font-weight:850;overflow-wrap:anywhere}
.history-sub{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.history-amount{font-size:14px;font-weight:900;white-space:nowrap}
.income{color:var(--green)}.expense{color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 5px}
.modal-backdrop{
  position:fixed;inset:0;background:#15182c80;z-index:20;
  display:flex;align-items:center;justify-content:center;padding:15px;
}
.modal{
  background:#fff;border-radius:21px;padding:21px;width:min(100%,480px);
  max-height:90vh;overflow-y:auto;box-shadow:0 20px 70px #15182c30;
}
.modal h2{font-size:20px;margin:0 0 17px}
.modal-close{float:right;background:#f1f2f8;border-radius:9px;padding:5px 10px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#24283a;color:#fff;padding:12px 17px;border-radius:13px;
  z-index:50;font-size:13px;max-width:90%;text-align:center;
  box-shadow:0 8px 30px #0002;
}
.admin-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-box{border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}
.admin-box h3{margin:0 0 12px;font-size:15px}
.admin-box .field{margin-bottom:10px}
.admin-box .btn{margin-top:4px}
.lookup-result{margin-top:12px;background:#f6f7ff;border-radius:12px;padding:13px;
  font-size:13px;line-height:1.8;overflow-wrap:anywhere}
@media(max-width:560px){
  main{padding:14px 12px 35px}
  .card{padding:20px}
  .actions{gap:7px}
  .action{font-size:12px;padding:13px 3px}
  .admin-layout{grid-template-columns:1fr}
  .person-bar{padding:10px}
  .stats{gap:8px}
}
</style>
</head>
<body>

<header>
  <div class="logo">● 가상은행</div>
  <div class="header-right">
    <button class="small-btn" onclick="openLookup()">계좌 찾기</button>
    <button class="small-btn" onclick="openAdminLogin()" aria-label="관리자">⚙</button>
  </div>
</header>

<main id="home">
  <div class="section-title">계좌 주인</div>
  <div class="person-bar">
    <button class="arrow" onclick="movePerson(-1)">‹</button>
    <div class="person-name">
      <div id="personName">계좌 주인</div>
      <div class="account-count" id="personMeta"></div>
    </div>
    <button class="arrow" onclick="movePerson(1)">›</button>
  </div>

  <div class="section-title">내 계좌</div>
  <div class="card">
    <div class="card-top">
      <div class="bank-line">
        <span class="bank-ball" id="bankBall"></span>
        <span id="bankName">대한은행</span>
      </div>
      <div class="owner" id="cardOwner">계좌 소유자</div>
      <div class="account-number" id="accountNumber">000-000-000000</div>
    </div>
    <div class="card-bottom">
      <div>
        <div class="balance-label">사용 가능한 잔액</div>
        <div class="balance" id="balance">100,000원</div>
      </div>
      <div class="account-position" id="accountPosition">1 / 1</div>
    </div>
  </div>

  <div class="actions">
    <button class="action primary" onclick="openTransfer()"><span>↗</span>송금하기</button>
    <button class="action" onclick="openDetails()"><span>▤</span>계좌정보</button>
    <button class="action" onclick="openCreate(false)"><span>＋</span>계좌 추가</button>
    <button class="action" onclick="openPasswordChange()"><span>🔒</span>비밀번호</button>
    <button class="action" onclick="copyAccountNumber()"><span>▣</span>번호 복사</button>
    <button class="action" onclick="openLookup()"><span>⌕</span>계좌 조회</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">이 사람의 전체 잔액</div>
      <div class="stat-value" id="totalBalance">100,000원</div>
    </div>
    <div class="stat">
      <div class="stat-label">보유 계좌 수</div>
      <div class="stat-value" id="totalAccounts">1개</div>
    </div>
  </div>

  <div class="section-title">거래 내역</div>
  <div class="panel">
    <div class="history-head">
      <strong>최근 거래</strong>
      <select id="historyFilter" onchange="renderHistory()" style="border:1px solid var(--line);border-radius:9px;padding:7px">
        <option value="all">전체</option>
        <option value="in">입금</option>
        <option value="out">출금</option>
      </select>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</main>

<section id="adminPage" class="hidden">
  <main>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div>
        <div class="section-title" style="margin-top:5px">관리자 패널</div>
        <div class="hint">가상은행 계좌 관리</div>
      </div>
      <button class="btn" onclick="closeAdmin()">나가기</button>
    </div>

    <div class="panel" style="margin-top:15px">
      <div class="field">
        <label>관리할 계좌 주인</label>
        <select id="adminPerson" onchange="onAdminPersonChange()"></select>
      </div>
      <div class="field">
        <label>관리할 계좌</label>
        <select id="adminAccount" onchange="onAdminAccountChange()"></select>
      </div>
      <div id="adminSelectedInfo" class="lookup-result"></div>
    </div>

    <div class="admin-layout" style="margin-top:12px">
      <div class="admin-box">
        <h3>💰 잔액 관리</h3>
        <div class="field">
          <label>변경할 잔액 (원)</label>
          <input id="adminBalance" type="number" min="0" placeholder="예: 100000">
        </div>
        <button class="btn primary full" onclick="changeBalance()">잔액 적용</button>
      </div>
      <div class="admin-box">
        <h3>🏦 계좌 만들기</h3>
        <button class="btn primary full" onclick="openCreate(false)">선택한 사람에게 만들기</button>
        <button class="btn full" onclick="openCreate(true)">새로운 사람 계좌 만들기</button>
      </div>
      <div class="admin-box">
        <h3>🔐 비밀번호 관리</h3>
        <div class="field">
          <label>새 비밀번호</label>
          <input id="adminNewPassword" type="password" placeholder="새 비밀번호 입력">
        </div>
        <button class="btn full" onclick="adminChangePassword()">비밀번호 변경</button>
      </div>
      <div class="admin-box">
        <h3>🗑️ 계좌 관리</h3>
        <button class="btn danger full" onclick="deleteAccount()">선택 계좌 삭제</button>
        <div class="hint">삭제하면 해당 계좌의 거래 내역도 사라져.</div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px">
      <h3 style="margin-top:0">⚠️ 전체 데이터 초기화</h3>
      <div class="hint" style="margin-bottom:12px">모든 사람, 계좌, 잔액, 거래 내역을 삭제하고 처음 상태로 되돌려.</div>
      <button class="btn danger full" onclick="resetAll()">전체 데이터 초기화</button>
    </div>
  </main>
</section>

<div id="modalBackdrop" class="modal-backdrop hidden" onclick="backdropClose(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const STORAGE_KEY = "virtual_bank_complete_v3";
const ADMIN_PASSWORD = "5555000";

function uid(){
  return "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function cleanNumber(value){
  return String(value || "").replace(/\D/g,"");
}
function money(value){
  return Math.round(Number(value)||0).toLocaleString("ko-KR") + "원";
}
function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function timestamp(){
  return new Date().toLocaleString("ko-KR",{
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit"
  });
}
function freshData(){
  const bank = "대한은행";
  return {
    version:3,
    people:[{
      id:uid(),name:"강리노",
      accounts:[{
        id:uid(),bank,number:"482-731-905164",
        balance:100000,password:"1234",
        history:[{
          id:uid(),type:"in",title:"계좌 개설",
          detail:"가상은행 계좌가 개설됐어.",
          amount:100000,time:timestamp()
        }]
      }]
    }],
    colors:{"대한은행":"#6578ee"}
  };
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed && Array.isArray(parsed.people) && parsed.people.length){
        parsed.colors=parsed.colors||{};
        parsed.people.forEach(p=>{
          p.accounts=Array.isArray(p.accounts)?p.accounts:[];
          p.accounts.forEach(a=>{
            a.history=Array.isArray(a.history)?a.history:[];
            a.balance=Math.max(0,Number(a.balance)||0);
            a.number=formatExistingNumber(a.number||generateAccountNumber());
            a.bank=a.bank||"대한은행";
            a.password=String(a.password||"1234");
            if(!a.id)a.id=uid();
          });
        });
        parsed.people=parsed.people.filter(p=>p.accounts.length);
        if(parsed.people.length){
          parsed.people.forEach(p=>{if(!p.id)p.id=uid()});
          return parsed;
        }
      }
    }
  }catch(e){}
  const d=freshData();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  return d;
}
let data=loadData();
let personIndex=0;
let accountIndex=0;
let adminPersonIndex=0;
let adminAccountIndex=0;
let toastTimer;

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function currentPerson(){
  if(!data.people.length)data=freshData();
  personIndex=Math.max(0,Math.min(personIndex,data.people.length-1));
  return data.people[personIndex];
}
function currentAccount(){
  const p=currentPerson();
  if(!p.accounts.length){
    p.accounts.push(makeAccount(p.name,"대한은행",100000,"1234"));
  }
  accountIndex=Math.max(0,Math.min(accountIndex,p.accounts.length-1));
  return p.accounts[accountIndex];
}
function allAccounts(){
  return data.people.flatMap(p=>p.accounts.map(a=>({person:p,account:a})));
}

/* 계좌번호는 항상 하이픈이 포함된 형태로 저장하고 표시 */
function formatDigits(digits){
  digits=cleanNumber(digits);
  if(digits.length<6)return digits;
  const patterns={
    6:[2,4],
    7:[3,4],
    8:[4,4],
    9:[3,3,3],
    10:[3,3,4],
    11:[3,4,4],
    12:[3,3,6],
    13:[3,4,3,3],
    14:[3,3,4,4],
    15:[3,4,4,4],
    16:[4,4,4,4],
    17:[3,4,4,3,3],
    18:[3,3,4,4,4]
  };
  let groups=patterns[digits.length];
  if(!groups){
    groups=[];
    let left=digits.length;
    while(left>0){
      const n=left>4?3:left;
      groups.push(n);
      left-=n;
    }
  }
  const out=[];
  let pos=0;
  for(const n of groups){
    if(pos>=digits.length)break;
    out.push(digits.slice(pos,pos+n));
    pos+=n;
  }
  if(pos<digits.length)out.push(digits.slice(pos));
  return out.join("-");
}
function formatExistingNumber(value){
  const digits=cleanNumber(value);
  if(!digits)return generateAccountNumber();
  return formatDigits(digits);
}
function generateAccountNumber(){
  const lengths=[9,10,11,12,13,14,15,16];
  const length=lengths[Math.floor(Math.random()*lengths.length)];
  let digits="";
  for(let i=0;i<length;i++){
    digits+=Math.floor(Math.random()*10);
  }
  if(digits[0]==="0")digits="4"+digits.slice(1);
  return formatDigits(digits);
}
function normalizeNewAccountNumber(input){
  const digits=cleanNumber(input);
  if(!digits)return generateAccountNumber();
  if(digits.length<6 || digits.length>18) return null;
  return formatDigits(digits);
}

function getColor(bank){
  if(data.colors[bank])return data.colors[bank];
  const palette=[
    "#6578ee","#19a77b","#ef8d4c","#9b70dd",
    "#e7658a","#299dc1","#c6a12c","#526d8c",
    "#df6d55","#40a9a1","#8a9b45","#d07db1"
  ];
  const used=Object.values(data.colors);
  const available=palette.filter(c=>!used.includes(c));
  data.colors[bank]=available.length
    ?available[0]
    :palette[Object.keys(data.colors).length%palette.length];
  saveData();
  return data.colors[bank];
}
function makeAccount(owner,bank,balance,password,number){
  bank=(bank||"대한은행").trim()||"대한은행";
  return {
    id:uid(),bank,
    number:formatExistingNumber(number||generateAccountNumber()),
    balance:Math.max(0,Number(balance)||0),
    password:String(password||"1234"),
    history:[{
      id:uid(),type:"in",title:"계좌 개설",
      detail:owner+" 계좌 개설",
      amount:Math.max(0,Number(balance)||0),time:timestamp()
    }]
  };
}
function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("hidden"),2600);
}
function render(){
  const p=currentPerson();
  const a=currentAccount();
  document.getElementById("personName").textContent=p.name+"님의 계좌";
  document.getElementById("personMeta").textContent=
    p.accounts.length+"개 계좌 보유";
  document.getElementById("bankName").textContent=a.bank;
  document.getElementById("bankBall").style.background=getColor(a.bank);
  document.getElementById("cardOwner").textContent=p.name+"님";
  document.getElementById("accountNumber").textContent=a.number;
  document.getElementById("balance").textContent=money(a.balance);
  document.getElementById("accountPosition").textContent=
    (accountIndex+1)+" / "+p.accounts.length;
  document.getElementById("totalBalance").textContent=
    money(p.accounts.reduce((sum,item)=>sum+item.balance,0));
  document.getElementById("totalAccounts").textContent=p.accounts.length+"개";
  renderHistory();
  saveData();
}
function renderHistory(){
  const a=currentAccount();
  const filter=document.getElementById("historyFilter").value;
  const list=document.getElementById("historyList");
  const entries=[...a.history].reverse().filter(h=>filter==="all"||h.type===filter);
  if(!entries.length){
    list.innerHTML='<div class="empty">표시할 거래 내역이 없어.</div>';
    return;
  }
  list.innerHTML=entries.map(h=>{
    const isIn=h.type==="in";
    const sign=isIn?"+":"−";
    return `<div class="history-item">
      <div class="history-icon">${isIn?"↙":"↗"}</div>
      <div class="history-main">
        <div class="history-title">${escapeHTML(h.title)}</div>
        <div class="history-sub">${escapeHTML(h.detail||"")} · ${escapeHTML(h.time||"")}</div>
      </div>
      <div class="history-amount ${isIn?"income":"expense"}">${sign}${money(h.amount)}</div>
    </div>`;
  }).join("");
}
function movePerson(direction){
  personIndex=(personIndex+direction+data.people.length)%data.people.length;
  accountIndex=0;render();
}
function moveAccount(direction){
  const p=currentPerson();
  accountIndex=(accountIndex+direction+p.accounts.length)%p.accounts.length;
  render();
}

/* 카드의 계좌번호 영역을 누르면 다음/이전 계좌를 볼 수 있게도 함 */

    </div>

      <input id="transferAmount" type="number" min="1" step="1" placeholder="예: 10000">
    </div>

      <input id="transferPassword" type="password" autocomplete="off" placeholder="계좌 비밀번호">
    </div>
    <button class="btn primary full" onclick="transfer()">송금하기</button>`);

function transfer(){
  const sender=currentAccount();
  const bank=document.getElementById("transferBank").value;
  const digits=cleanNumber(document.getElementById("transferNumber").value);
  const amount=Number(document.getElementById("transferAmount").value);
  const password=document.getElementById("transferPassword").value;
  if(password!==sender.password){showToast("계좌 비밀번호가 틀렸어.");return}
  if(!digits){showToast("받는 계좌번호를 입력해 줘.");return}
  if(!Number.isSafeInteger(amount)||amount<=0){showToast("송금 금액을 확인해 줘.");return}
  if(amount>sender.balance){showToast("잔액이 부족해.");return}
  const senderId=sender.id;
  const match=allAccounts().find(x=>
    x.account.bank===bank&&cleanNumber(x.account.number)===digits
  );
  if(!match){showToast("받는 계좌를 찾을 수 없어.");return}
  const receiver=match.account;
  if(receiver.id===senderId){showToast("자기 자신에게는 송금할 수 없어.");return}
  const senderPerson=currentPerson();
  const receiverName=match.person.name;
  sender.balance-=amount;
  receiver.balance+=amount;
  const time=timestamp();
  sender.history.push({
    id:uid(),type:"out",title:"송금",
    detail:receiverName+" · "+receiver.bank+" "+receiver.number,
    amount,time
  });
  receiver.history.push({
    id:uid(),type:"in",title:"송금받기",
    detail:senderPerson.name+" · "+sender.bank+" "+sender.number,
    amount,time
  });
  saveData();closeModal();render();
  showToast(money(amount)+" 송금 완료!");
}
function randomBank(){
  const banks=["대한은행","두리은행","수난은행"];
  return banks[Math.floor(Math.random()*banks.length)];
}

function createAccount(newPerson){
  const owner=document.getElementById("newOwner").value.trim();
  let bank=document.getElementById("newBank").value.trim();
  const rawNumber=document.getElementById("newNumber").value.trim();
  const balance=Number(document.getElementById("newBalance").value);
  const password=document.getElementById("newPassword").value;
  if(!owner){showToast("계좌 주인 이름을 입력해 줘.");return}
  if(!Number.isSafeInteger(balance)||balance<0){showToast("처음 잔액을 확인해 줘.");return}
  if(!password){showToast("계좌 비밀번호를 설정해 줘.");return}
  if(!bank)bank=randomBank();
  const number=normalizeNewAccountNumber(rawNumber);
  if(number===null){showToast("계좌번호는 숫자 6~18자리로 입력해 줘.");return}
  if(allAccounts().some(x=>cleanNumber(x.account.number)===cleanNumber(number))){
    showToast("이미 사용 중인 계좌번호야. 다른 번호를 입력해 줘.");return
  }
  let person;
  if(newPerson){
    person=data.people.find(p=>p.name.toLowerCase()===owner.toLowerCase());
    if(!person){
      person={id:uid(),name:owner,accounts:[]};
      data.people.push(person);
    }
  }else{
    person=selectedPersonForCreate();
    if(!person){showToast("계좌 주인을 찾을 수 없어.");return}
  }
  const account=makeAccount(owner,bank,balance,password,number);
  person.accounts.push(account);
  personIndex=data.people.findIndex(p=>p.id===person.id);
  accountIndex=person.accounts.length-1;
  adminPersonIndex=personIndex;
  adminAccountIndex=accountIndex;
  saveData();closeModal();render();
  showToast("계좌 개설 완료! "+account.number);
}
function selectedPersonForCreate(){
  if(document.getElementById("adminPage").classList.contains("hidden")){

  const id=document.getElementById("adminPerson").value;
  return data.people.find(p=>p.id===id)||currentPerson();
}

function deleteAccount(){
  const p=adminSelectedPerson(),a=adminSelectedAccount();
  if(!p||!a){showToast("삭제할 계좌를 선택해 줘.");return}
  if(!confirm(`${p.name}님의 ${a.number} 계좌를 삭제할까? 이 작업은 되돌릴 수 없어.`))return;
  p.accounts=p.accounts.filter(x=>x.id!==a.id);
  if(!p.accounts.length){
    data.people=data.people.filter(x=>x.id!==p.id);
  }
  if(!data.people.length){
    data=freshData();personIndex=0;accountIndex=0;
  }
  personIndex=Math.max(0,data.people.findIndex(x=>x.id===p.id));
  if(personIndex<0)personIndex=0;
  accountIndex=0;adminPersonIndex=personIndex;adminAccountIndex=0;
  saveData();render();
  if(document.getElementById("adminPage").classList.contains("hidden"))return;
  renderAdmin();showToast("계좌를 삭제했어.");
}
