<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아뱅크 · INFINITY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

:root{
  --bg:#f8f5ef;--paper:#fffefa;--ink:#39372f;--muted:#969084;
  --gold:#b99458;--line:#eee7da;--green:#43866b;--red:#c7665c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;transition:.2s}
button:active{transform:scale(.97)}
.top{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100% - 1100px)/2))}
.logo{display:flex;align-items:center;gap:11px;font-family:'Jua',sans-serif;font-size:23px}
.logo-icon{width:43px;height:43px;border-radius:16px;background:linear-gradient(145deg,#f3dfb5,#bd9859);display:grid;place-items:center;color:white;font-size:25px;box-shadow:0 5px 14px #b9945828}
.logo small{display:block;font:11px 'Gowun Dodum';color:var(--muted);letter-spacing:2px;margin-top:3px}
button{border:0}
.btn{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:11px 16px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px #0000000b}
.gold{background:linear-gradient(135deg,#c7a66b,#a98346);color:white}
main{max-width:1080px;margin:auto;padding:28px 20px 60px}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:10px 0 25px}
h1,h2,h3,p{margin-top:0}
h1{font:32px 'Jua',sans-serif;margin-bottom:8px}
.subtitle{color:var(--muted);font-size:14px}
.person-switch{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);padding:7px;border-radius:17px}
.person-switch button{width:34px;height:34px;border-radius:12px;background:#f3eee3;color:#8c7042;font-size:22px}
.person-name{font:19px 'Jua';min-width:70px;text-align:center}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:0 12px 35px #57401a08;min-width:0}
.bankcard{min-height:235px;border-radius:25px;padding:24px;color:#fff;background:linear-gradient(130deg,#30372e,#55513c);position:relative;overflow:hidden}
.bankcard:before{content:"";position:absolute;width:230px;height:230px;border:1px solid #e4d1a333;border-radius:50%;right:-60px;top:-100px;box-shadow:0 0 0 30px #e4d1a30b,0 0 0 60px #e4d1a307}
.bankcard:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #e4d1a322;border-radius:50%;right:80px;bottom:-100px}
.banktop,.bankbottom{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bankname{font:18px 'Jua';color:#f0dfb9}
.chip{width:39px;height:29px;border-radius:8px;background:linear-gradient(135deg,#eadcb2,#b19251)}
.balance-label{margin-top:29px;color:#d9d4c6;font-size:13px}
.balance{font:40px 'Jua';margin:7px 0 21px;overflow-wrap:anywhere}
.accno{font-size:15px;letter-spacing:1px;color:#f5f0e5}
.owner{font-size:12px;color:#d6c9a8;margin-bottom:6px}
select,input{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:13px;padding:13px;outline:none}
input:focus,select:focus{border-color:#c3a36a;box-shadow:0 0 0 3px #c3a36a20}
.accselect{margin-top:12px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.quick button{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:14px 5px;color:var(--ink);font:17px 'Jua'}
.quick span{display:block;font-size:23px;color:var(--gold);margin-bottom:6px}
.quick small{display:block;font:11px 'Gowun Dodum';color:var(--muted);margin-top:5px}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.card-title h2{font:20px 'Jua';margin:0}
.pill{border:1px solid var(--line);border-radius:30px;padding:6px 10px;color:var(--muted);font-size:11px}
.field{margin:13px 0}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
.wide{width:100%;padding:14px}
.notice{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}
.section{margin-top:20px}
.tx{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.txicon{width:40px;height:40px;border-radius:14px;background:#f3eddf;display:grid;place-items:center;color:#a2854c;font-size:20px;flex-shrink:0}
.txmain{flex:1;min-width:0}
.txmain b{font-size:13px;font-weight:normal;display:block;overflow-wrap:anywhere}
.txmain small{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.amount{font-size:13px;white-space:nowrap}
.plus{color:var(--green)}.minus{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:13px;line-height:1.8}
.modal-bg{display:none;position:fixed;inset:0;z-index:10;background:#25231c88;backdrop-filter:blur(7px);padding:14px;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:min(560px,100%);max-height:91vh;overflow:auto;background:var(--paper);border-radius:25px;box-shadow:0 25px 90px #0003;animation:appear .2s ease}
.modal.large{width:min(900px,100%)}
.modal-head{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 21px;display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font:22px 'Jua';margin:0}
.close{width:35px;height:35px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:22px;color:var(--ink)}
.modal-body{padding:21px}
.confirm{background:linear-gradient(135deg,#f5ecd9,#fffaf1);border-radius:18px;padding:20px;text-align:center;margin:14px 0;color:#40382a}
.confirm strong{display:block;font:27px 'Jua';margin:10px 0}
.admin-banner{background:linear-gradient(135deg,#30352b,#554c39);color:white;border-radius:17px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-banner small{color:#e6d5ae}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.adminbox{border:1px solid var(--line);border-radius:18px;padding:15px;min-width:0}
.adminbox h3{font:18px 'Jua';margin-bottom:12px}
.adminbox .btn{font-size:12px;padding:10px}
.adminbox .field{margin:10px 0}
.admin-list{max-height:160px;overflow:auto}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}
.admin-row:last-child{border-bottom:0}
.admin-row .btn{padding:7px 9px}
.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translate(-50%,15px);background:#33352b;color:#fff;padding:13px 19px;border-radius:15px;opacity:0;pointer-events:none;transition:.25s;font-size:13px;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;padding:24px;color:var(--muted);font-size:11px}
@keyframes appear{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:720px){
 .top{padding:0 13px;height:67px}.logo{font-size:18px}.logo-icon{width:37px;height:37px}
 .top .btn{padding:9px 10px;font-size:12px}
 main{padding:20px 13px 40px}.layout{grid-template-columns:1fr}
 .welcome{align-items:flex-start;flex-direction:column}h1{font-size:28px}
 .card{padding:17px;border-radius:21px}.bankcard{padding:21px}
 .balance{font-size:35px}.admin-grid{grid-template-columns:1fr}
 .modal-body{padding:15px}.modal-head{padding:15px}
}
body.dark{--bg:#1b1c18;--paper:#272821;--ink:#f5f0e5;--muted:#b0aa9b;--line:#414137}
body.dark .person-switch button{background:#39372c;color:#e5cc94}
body.dark .txicon{background:#39372c}
body.dark .confirm{background:#393427;color:#f6eedc}
</style>
</head>
<body>
<header class="top">
 <div class="logo"><div class="logo-icon">M</div><div>모아뱅크<small>INFINITY · MY LITTLE BANK</small></div></div>
 <div style="display:flex;gap:8px">
  <button class="btn" id="themeBtn">☾ 테마</button>
  <button class="btn gold" id="adminBtn">관리자 ✦</button>
 </div>
</header>
<main>
 <div class="welcome">
  <div><h1>오늘도 반가워요 ☁️</h1><div class="subtitle">내 돈을 귀엽고 똑똑하게 관리해 봐요.</div></div>
  <div class="person-switch">
   <button id="prev">‹</button><div class="person-name" id="personName">조인택</div><button id="next">›</button>
  </div>
 </div>
 <div class="layout">
  <section>
   <div class="bankcard">
    <div class="banktop"><div class="bankname" id="bankName">개한은행</div><div class="chip"></div></div>
    <div class="balance-label">내 계좌 잔액</div>
    <div class="balance" id="balance">₩100,000</div>
    <div class="bankbottom"><div><div class="owner" id="owner">조인택 님의 계좌</div><div class="accno" id="number">583-7291-0462</div></div><span style="font-size:11px;color:#e3d5b2">MOA SIGNATURE</span></div>
   </div>
   <select class="accselect" id="accountSelect"></select>
   <div class="quick">
    <button id="sendBtn"><span>↗</span>송금<small>안전하게 보내기</small></button>
    <button id="lookupBtn"><span>⌕</span>계좌 조회<small>계좌 찾기</small></button>
    <button id="historyBtn"><span>↻</span>거래 내역<small>기록 보기</small></button>
   </div>
   <div class="card section"><div class="card-title"><h2>최근 거래 🧾</h2><span class="pill">ACTIVITY</span></div><div id="history"></div></div>
  </section>
  <section>
   <div class="card">
    <div class="card-title"><h2>간편 송금 💌</h2><span class="pill">QUICK SEND</span></div>
    <div class="field"><label>받는 계좌번호</label><input id="quickNumber" placeholder="숫자를 입력해 주세요"></div>
    <div class="field"><label>받는 은행</label><select id="quickBank"></select></div>
    <div class="field"><label>송금 금액 (원)</label><input id="quickAmount" type="number" min="1" placeholder="얼마를 보낼까요?"></div>
    <button class="btn gold wide" id="quickGo">받는 분 확인하기 →</button>
    <div class="notice">받는 분과 금액을 확인한 다음, 출금 계좌 비밀번호를 입력하면 송금돼요.</div>
   </div>
   <div class="card section">
    <div class="card-title"><h2>내 계좌 도구 🪄</h2></div>
    <button class="btn wide" id="favBtn">☆ 현재 계좌 즐겨찾기</button>
    <button class="btn wide" style="margin-top:9px" id="passBtn">계좌 비밀번호 설정 / 변경</button>
    <button class="btn wide" style="margin-top:9px" id="backupBtn">데이터 백업 / 복원</button>
    <div class="notice">가상 은행 시뮬레이터이며 실제 돈이 이동하지는 않아요.</div>
   </div>
  </section>
 </div>
</main>
<footer>MOA BANK · 작은 순간도 소중하게</footer>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal">
 <div class="modal-head"><h2 id="modalTitle">안녕하세요!</h2><button class="close" id="close">×</button></div>
 <div class="modal-body" id="modalBody"></div>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(()=>{
const $=id=>document.getElementById(id);
const DBKEY="moa_cute_bank_v5",ADMINKEY="moa_cute_admin_v5",PASSKEY="moa_cute_pass_v5",FAVKEY="moa_cute_fav_v5";
const id=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const dig=s=>String(s||"").replace(/\D/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cash=n=>new Intl.NumberFormat("ko-KR",{style:"currency",currency:"KRW",maximumFractionDigits:0}).format(Number(n)||0);
const stamp=()=>new Date().toLocaleString("ko-KR",{dateStyle:"short",timeStyle:"short"});
const banks=[
 {id:"b_gaehan",name:"개한은행",groups:[3,4,4]},
 {id:"b_haneui",name:"하늬은행",groups:[4,3,4]},
 {id:"b_geuru",name:"그루뱅크",groups:[3,3,5]}
];
const people=[
 {id:"p_int",name:"조인택"},
 {id:"p_iru",name:"이루"},
 {id:"p_oh",name:"오철수"}
];
const initialAccounts=[
 {id:"a_int",personId:"p_int",bankId:"b_gaehan",number:"583-7291-0462",balance:100000,alias:"개한은행 계좌"},
 {id:"a_iru",personId:"p_iru",bankId:"b_haneui",number:"7148-296-5831",balance:100000,alias:"하늬은행 계좌"},
 {id:"a_oh",personId:"p_oh",bankId:"b_geuru",number:"826-417-59308",balance:100000,alias:"그루뱅크 계좌"}
];
const initialDB={banks,people,accounts:initialAccounts,transactions:[]};
function load(){
 try{const d=JSON.parse(localStorage.getItem(DBKEY));if(d&&d.people&&d.accounts&&d.banks&&d.transactions)return d}catch(e){}
 localStorage.setItem(DBKEY,JSON.stringify(initialDB));return JSON.parse(JSON.stringify(initialDB));
}
let db=load(),passes={},favs=[],personIndex=0,accountId="",adminOn=false,pending=null,timer;
try{passes=JSON.parse(localStorage.getItem(PASSKEY)||"{}")}catch(e){}
try{favs=JSON.parse(localStorage.getItem(FAVKEY)||"[]")}catch(e){}
function save(){localStorage.setItem(DBKEY,JSON.stringify(db));localStorage.setItem(PASSKEY,JSON.stringify(passes));localStorage.setItem(FAVKEY,JSON.stringify(favs))}
function toast(s){$("toast").textContent=s;$("toast").classList.add("on");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("on"),2400)}
function currentPerson(){return db.people[personIndex]||db.people[0]}
function accounts(){const p=currentPerson();return db.accounts.filter(a=>a.personId===p?.id)}
function currentAccount(){return accounts().find(a=>a.id===accountId)||accounts()[0]||null}
function bank(a){return db.banks.find(b=>b.id===a?.bankId)||{name:"은행"}}
function groupText(g){return (g||[3,4,4]).join("-")}
function genNumber(g){return g.map(n=>String(Math.floor(Math.random()*Math.pow(10,n))).padStart(n,"0")).join("-")}
function uniqueNumber(bid,g){let n;do{n=genNumber(g)}while(db.accounts.some(a=>a.bankId===bid&&dig(a.number)===dig(n)));return n}
function addTx(a,type,title,amount,memo=""){db.transactions.push({id:id(),accountId:a.id,type,title,amount:Number(amount),memo,time:stamp()})}
function show(title,html,large=false){
 $("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.toggle("large",large);$("modalBg").classList.add("show");document.body.style.overflow="hidden";
}
function closeModal(){
 $("modalBg").classList.remove("show");document.body.style.overflow="";
 if(adminOn){adminOn=false;toast("관리자 모드가 종료됐어요.");}
}
$("close").onclick=closeModal;
$("modalBg").onclick=e=>{if(e.target===$("modalBg"))closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modalBg").classList.contains("show"))closeModal()});
function txHTML(a,limit=100){
 const list=db.transactions.filter(t=>t.accountId===a.id).slice().reverse().slice(0,limit);
 if(!list.length)return '<div class="empty">아직 거래 내역이 없어요 ☁️<br>첫 거래가 여기에 기록돼요.</div>';
 return list.map(t=>`<div class="tx"><div class="txicon">${t.type==="in"?"↙":t.type==="out"?"↗":"✦"}</div><div class="txmain"><b>${esc(t.title)}</b><small>${esc(t.time)}${t.memo?" · "+esc(t.memo):""}</small></div><div class="amount ${t.type==="in"?"plus":t.type==="out"?"minus":""}">${t.type==="in"?"+":t.type==="out"?"−":""}${cash(t.amount)}</div></div>`).join("");
}
function render(){
 if(!db.people.length){db.people=[{id:"p_int",name:"조인택"}]}
 personIndex=Math.max(0,Math.min(personIndex,db.people.length-1));
 const p=currentPerson(),list=accounts(),a=currentAccount();
 if(a)accountId=a.id;else accountId="";
 $("personName").textContent=p.name;
 $("accountSelect").innerHTML=list.length?list.map(a=>`<option value="${esc(a.id)}">${esc(a.alias||bank(a).name)} · ${esc(a.number)}</option>`).join(""):'<option value="">계좌가 없습니다</option>';
 if(a)$("accountSelect").value=a.id;
 $("bankName").textContent=a?bank(a).name:"계좌 없음";
 $("balance").textContent=a?cash(a.balance):"계좌 없음";
 $("owner").textContent=a?p.name+" 님의 계좌":"계좌를 개설해 주세요";
 $("number").textContent=a?a.number:"MOA BANK";
 $("history").innerHTML=a?txHTML(a,5):'<div class="empty">계좌를 개설하면 여기에 표시돼요.</div>';
 $("quickBank").innerHTML=db.banks.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
 $("sendBtn").disabled=!a;$("quickGo").disabled=!a;
}
$("accountSelect").onchange=()=>{accountId=$("accountSelect").value;render()};
$("prev").onclick=()=>{personIndex=(personIndex-1+db.people.length)%db.people.length;accountId="";render()};
$("next").onclick=()=>{personIndex=(personIndex+1)%db.people.length;accountId="";render()};
$("sendBtn").onclick=()=>transferForm();
$("quickGo").onclick=()=>transferForm($("quickNumber").value,$("quickBank").value,$("quickAmount").value);
function transferForm(num="",bid="",amount=""){
 if(!currentAccount()){toast("먼저 계좌를 개설해 주세요.");return}
 show("송금할 내용을 확인해요 💌",`
 <div class="field"><label>받는 계좌번호</label><input id="toNum" value="${esc(num)}" placeholder="계좌번호를 입력해 주세요"></div>
 <div class="field"><label>받는 은행</label><select id="toBank">${db.banks.map(b=>`<option value="${esc(b.id)}" ${b.id===bid?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>
 <div class="field"><label>송금 금액 (원)</label><input id="toAmt" type="number" min="1" value="${esc(amount)}" placeholder="보낼 금액"></div>
 <div class="field"><label>메모 (선택)</label><input id="toMemo" maxlength="60" placeholder="예: 용돈"></div>
 <button class="btn gold wide" id="checkRecipient">받는 분 확인하기 →</button>`);
 $("checkRecipient").onclick=()=>{
  const n=dig($("toNum").value),b=$("toBank").value,amt=Number($("toAmt").value),memo=$("toMemo").value.trim();
  if(!n){toast("계좌번호를 입력해 주세요.");return}
  if(!Number.isSafeInteger(amt)||amt<=0){toast("송금 금액을 확인해 주세요.");return}
  const to=db.accounts.find(a=>a.bankId===b&&dig(a.number)===n),from=currentAccount();
  if(!to){toast("해당 계좌를 찾을 수 없어요.");return}
  if(to.id===from.id){toast("같은 계좌로는 송금할 수 없어요.");return}
  if(amt>from.balance){toast("잔액이 부족해요.");return}
  pending={fromId:from.id,toId:to.id,amount:amt,memo};confirmTransfer();
 };
}
function confirmTransfer(){
 const t=pending;if(!t)return;
 const from=db.accounts.find(a=>a.id===t.fromId),to=db.accounts.find(a=>a.id===t.toId);
 if(!from||!to)return;
 const receiver=db.people.find(p=>p.id===to.personId);
 show("마지막으로 확인해 주세요 ✨",`
 <div class="confirm"><div>받는 분</div><strong>${esc(receiver?.name||"사용자")} 님에게</strong><strong>${cash(t.amount)}</strong><div>${esc(bank(to).name)} · ${esc(to.number)}</div></div>
 <div class="field"><label>출금 계좌</label><input disabled value="${esc(bank(from).name+" · "+from.number)}"></div>
 <div class="field"><label>계좌 비밀번호</label><input id="sendPass" type="password" autocomplete="current-password" placeholder="계좌 비밀번호를 입력해 주세요"></div>
 <button class="btn gold wide" id="sendConfirm">비밀번호 확인 후 송금</button>
 <button class="btn wide" style="margin-top:9px" id="sendBack">이전으로</button>
 <div class="notice">송금하려면 출금 계좌의 비밀번호가 필요해요.</div>`);
 $("sendConfirm").onclick=()=>{
  const password=$("sendPass").value;
  if(!password){toast("계좌 비밀번호를 입력해 주세요.");return}
  if(!passes[from.id]){toast("이 계좌의 비밀번호가 아직 설정되지 않았어요.");return}
  if(password!==passes[from.id]){$("sendPass").value="";$("sendPass").focus();toast("비밀번호가 일치하지 않아요.");return}
  if(from.balance<t.amount){toast("잔액이 부족해요.");return}
  from.balance-=t.amount;to.balance+=t.amount;
  addTx(from,"out",receiver.name+" 님에게 송금",t.amount,t.memo);
  const sender=db.people.find(p=>p.id===from.personId);
  addTx(to,"in",sender.name+" 님에게 받음",t.amount,t.memo);
  save();pending=null;closeModal();render();toast("송금이 완료됐어요 💛");
 };
 $("sendBack").onclick=()=>transferForm(to.number,to.bankId,t.amount);
}
$("lookupBtn").onclick=()=>{
 show("계좌 찾기 🔎",`<div class="field"><label>계좌번호</label><input id="lookupNum" placeholder="숫자를 입력해 주세요"></div><div class="field"><label>은행</label><select id="lookupBank">${db.banks.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select></div><button class="btn gold wide" id="lookupGo">계좌 조회</button><div id="lookupResult"></div>`);
 $("lookupGo").onclick=()=>{
  const a=db.accounts.find(a=>a.bankId===$("lookupBank").value&&dig(a.number)===dig($("lookupNum").value));
  const p=a&&db.people.find(p=>p.id===a.personId);
  $("lookupResult").innerHTML=a?`<div class="confirm"><div>찾았어요!</div><strong>${esc(p?.name||"사용자")} 님</strong><div>${esc(bank(a).name)} · ${esc(a.number)}</div></div><button class="btn gold wide" id="lookupSend">이 계좌로 송금</button>`:'<div class="empty">일치하는 계좌가 없어요.</div>';
  if(a)$("lookupSend").onclick=()=>transferForm(a.number,a.bankId);
 };
};
$("historyBtn").onclick=()=>{const a=currentAccount();show("전체 거래 내역 🧾",a?txHTML(a):'<div class="empty">계좌가 없어요.</div>')};
$("passBtn").onclick=()=>{
 const a=currentAccount();if(!a){toast("계좌가 없어요.");return}
 show("계좌 비밀번호 설정 🔐",`
 <div class="subtitle">${esc(bank(a).name)} · ${esc(a.number)}</div>
 ${passes[a.id]?'<div class="field"><label>현재 비밀번호</label><input id="oldPass" type="password"></div>':'<div class="notice">처음 사용하는 계좌예요. 비밀번호를 설정해 주세요.</div>'}
 <div class="field"><label>새 비밀번호 (4자 이상)</label><input id="newPass" type="password" autocomplete="new-password"></div>
 <div class="field"><label>새 비밀번호 확인</label><input id="newPassAgain" type="password" autocomplete="new-password"></div>
 <button class="btn gold wide" id="savePass">비밀번호 저장</button>`);
 $("savePass").onclick=()=>{
  if(passes[a.id]&&$("oldPass").value!==passes[a.id]){toast("현재 비밀번호가 틀렸어요.");return}
  const p=$("newPass").value;
  if(p.length<4){toast("비밀번호를 4자 이상 입력해 주세요.");return}
  if(p!==$("newPassAgain").value){toast("새 비밀번호가 서로 달라요.");return}
  passes[a.id]=p;save();closeModal();toast("비밀번호가 저장됐어요.");
 };
};
$("favBtn").onclick=()=>{
 const a=currentAccount();if(!a)return;
 if(favs.includes(a.id)){favs=favs.filter(x=>x!==a.id);save();toast("즐겨찾기에서 뺐어요.");return}
 favs.push(a.id);save();
 show("즐겨찾기 ☆",favs.map(fid=>db.accounts.find(a=>a.id===fid)).filter(Boolean).map(a=>`<div class="tx"><div class="txicon">☆</div><div class="txmain"><b>${esc(a.alias||bank(a).name)}</b><small>${esc(bank(a).name)} · ${esc(a.number)}</small></div><button class="btn" data-fsend="${esc(a.id)}">송금</button></div>`).join("")||'<div class="empty">즐겨찾기가 없어요.</div>');
 $("modalBody").querySelectorAll("[data-fsend]").forEach(b=>b.onclick=()=>{const a=db.accounts.find(a=>a.id===b.dataset.fsend);transferForm(a.number,a.bankId)});
};
$("backupBtn").onclick=()=>show("데이터 백업 / 복원",`<button class="btn gold wide" id="backupExport">전체 데이터 백업</button><button class="btn wide" style="margin-top:9px" id="backupImport">백업 파일 복원</button><div class="notice">백업에는 계좌 비밀번호가 포함될 수 있으니 파일을 안전하게 보관해 주세요.</div>`);
document.addEventListener("click",e=>{
 if(e.target.id==="backupExport")exportData();
 if(e.target.id==="backupImport")$("restoreFile").click();
});
function exportData(){
 const data={db,passes,favs,adminPassword:localStorage.getItem(ADMINKEY)};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="moabank-backup.json";a.click();URL.revokeObjectURL(u);toast("백업 파일을 저장했어요.");
}
$("restoreFile").onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{
  const d=JSON.parse(await f.text());
  if(!d.db?.people||!d.db?.accounts||!d.db?.banks||!d.db?.transactions)throw Error();
  db=d.db;passes=d.passes||{};favs=d.favs||[];
  if(d.adminPassword)localStorage.setItem(ADMINKEY,d.adminPassword);
  personIndex=0;accountId="";save();render();toast("복원이 완료됐어요.");
 }catch(err){toast("백업 파일을 확인해 주세요.")}
 e.target.value="";
};
$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("moa_cute_dark",document.body.classList.contains("dark")?"1":"0")};
if(localStorage.getItem("moa_cute_dark")==="1")document.body.classList.add("dark");

function adminLogin(){
 if(adminOn){adminPanel();return}
 const existing=localStorage.getItem(ADMINKEY);
 if(!existing){
  show("관리자 첫 설정 🔑",`<div class="notice">관리자 비밀번호를 처음 설정해 주세요. 관리자 화면의 X를 누르기 전까지 로그인 상태가 유지돼요.</div><div class="field"><label>새 관리자 비밀번호 (8자 이상)</label><input id="adminNew" type="password"></div><div class="field"><label>비밀번호 확인</label><input id="adminNew2" type="password"></div><button class="btn gold wide" id="adminSetup">설정하고 로그인</button>`);
  $("adminSetup").onclick=()=>{
   const p=$("adminNew").value;if(p.length<8){toast("8자 이상 입력해 주세요.");return}
   if(p!==$("adminNew2").value){toast("비밀번호가 서로 달라요.");return}
   localStorage.setItem(ADMINKEY,p);adminOn=true;adminPanel();
  };return;
 }
 show("관리자 로그인 🔐",`<div class="field"><label>관리자 비밀번호</label><input id="adminInput" type="password"></div><button class="btn gold wide" id="adminLoginGo">로그인</button>`);
 $("adminLoginGo").onclick=()=>{
  if($("adminInput").value!==localStorage.getItem(ADMINKEY)){toast("비밀번호가 일치하지 않아요.");return}
  adminOn=true;adminPanel();
 };
}
$("adminBtn").onclick=adminLogin;

function adminPanel(){
 if(!adminOn)return;
 show("관리자 센터 ✦",`
 <div class="admin-banner"><div><b>MOA BANK · ADMIN</b><br><small>로그인 유지 중 · X를 누르면 로그아웃</small></div><span>✧</span></div>
 <div class="admin-grid">
  <div class="adminbox"><h3>사람 추가 ☁️</h3>
   <div class="field"><label>이름</label><input id="pName" placeholder="새 사용자 이름"></div>
   <button class="btn gold wide" id="pAdd">사람 추가</button><div class="admin-list" id="pList"></div>
  </div>
  <div class="adminbox"><h3>은행 만들기 🏦</h3>
   <div class="field"><label>은행 이름</label><input id="bName" placeholder="예: 별빛은행"></div>
   <div class="field"><label>계좌번호 형식</label><input id="bFormat" value="3-4-5" placeholder="예: 3-4-5"></div>
   <button class="btn gold wide" id="bAdd">은행 생성</button><div class="admin-list" id="bList"></div>
  </div>
  <div class="adminbox"><h3>계좌 개설 💳</h3>
   <div class="field"><label>계좌 소유자</label><select id="aPerson">${db.people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></div>
   <div class="field"><label>은행</label><select id="aBank">${db.banks.map(b=>`<option value="${esc(b.id)}">${esc(b.name)} · ${groupText(b.groups)}</option>`).join("")}</select></div>
   <div class="field"><label>계좌 별칭</label><input id="aAlias" placeholder="예: 생활 계좌"></div>
   <div class="field"><label>계좌 비밀번호</label><input id="aPass" type="password" placeholder="4자 이상"></div>
   <div class="field"><label>초기 잔액</label><input id="aBalance" type="number" min="0" value="0"></div>
   <button class="btn gold wide" id="aCreate">계좌 개설</button>
  </div>
  <div class="adminbox"><h3>잔액 관리 ✨</h3>
   <div class="field"><label>계좌 선택</label><select id="manageAccount">${db.accounts.map(a=>`<option value="${esc(a.id)}">${esc(db.people.find(p=>p.id===a.personId)?.name||"사용자")} · ${esc(bank(a).name)} · ${esc(a.number)}</option>`).join("")}</select></div>
   <div class="field"><label>잔액 조정 (+/-)</label><input id="adjust" type="number" placeholder="예: 50000 또는 -5000"></div>
   <div class="field"><label>메모</label><input id="adjustMemo" placeholder="조정 사유"></div>
   <button class="btn gold wide" id="adjustGo">잔액 조정</button>
   <button class="btn wide" style="margin-top:8px" id="renameAccount">계좌 별칭 변경</button>
   <button class="btn" style="margin-top:8px;width:100%;color:var(--red)" id="deleteAccount">계좌 삭제</button>
  </div>
  <div class="adminbox"><h3>사람 관리 👥</h3>
   <div class="field"><label>사용자 선택</label><select id="deletePerson">${db.people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></div>
   <button class="btn wide" style="color:var(--red)" id="deletePersonGo">사용자 및 계좌 삭제</button>
  </div>
  <div class="adminbox"><h3>데이터 관리 ⚙️</h3>
   <button class="btn gold wide" id="adminExport">전체 백업 저장</button>
   <button class="btn wide" style="margin-top:8px" id="adminImport">백업 복원</button>
   <button class="btn wide" style="margin-top:8px;color:var(--red)" id="resetAll">가상 은행 초기화</button>
  </div>
 </div>`,true);
 $("pList").innerHTML=db.people.map(p=>`<div class="admin-row"><span>${esc(p.name)}</span><button class="btn" data-pselect="${esc(p.id)}">보기</button></div>`).join("");
 $("bList").innerHTML=db.banks.map(b=>`<div class="admin-row"><span>${esc(b.name)} · ${groupText(b.groups)}</span><span>${db.accounts.filter(a=>a.bankId===b.id).length}계좌</span></div>`).join("");
 $("pAdd").onclick=()=>{
  const name=$("pName").value.trim();if(!name){toast("이름을 입력해 주세요.");return}
  db.people.push({id:id(),name});personIndex=db.people.length-1;accountId="";save();render();adminPanel();toast("사람을 추가했어요.");
 };
 $("modalBody").querySelectorAll("[data-pselect]").forEach(b=>b.onclick=()=>{
  personIndex=db.people.findIndex(p=>p.id===b.dataset.pselect);accountId="";render();adminPanel();
 });
 $("bAdd").onclick=()=>{
  const name=$("bName").value.trim(),groups=$("bFormat").value.split("-").map(Number);
  if(!name){toast("은행 이름을 입력해 주세요.");return}
  if(groups.length<1||groups.length>5||groups.some(n=>!Number.isInteger(n)||n<2||n>8)){toast("계좌 형식을 3-4-5처럼 입력해 주세요.");return}
  if(db.banks.some(b=>b.name===name)){toast("같은 이름의 은행이 있어요.");return}
  db.banks.push({id:id(),name,groups});save();render();adminPanel();toast("은행을 만들었어요.");
 };
 $("aCreate").onclick=()=>{
  const personId=$("aPerson").value,bankId=$("aBank").value,pass=$("aPass").value,balance=Number($("aBalance").value);
  if(pass.length<4){toast("계좌 비밀번호는 4자 이상이어야 해요.");return}
  if(!Number.isSafeInteger(balance)||balance<0){toast("초기 잔액을 확인해 주세요.");return}
  const b=db.banks.find(b=>b.id===bankId),a={id:id(),personId,bankId,number:uniqueNumber(bankId,b.groups),balance,alias:$("aAlias").value.trim()||b.name};
  db.accounts.push(a);passes[a.id]=pass;if(balance)addTx(a,"adjust","계좌 개설 초기 잔액",balance);
  personIndex=db.people.findIndex(p=>p.id===personId);accountId=a.id;save();render();adminPanel();toast("계좌가 개설됐어요.");
 };
 $("adjustGo").onclick=()=>{
  const a=db.accounts.find(a=>a.id===$("manageAccount").value),amount=Number($("adjust").value);
  if(!a||!Number.isSafeInteger(amount)||amount===0){toast("조정할 금액을 입력해 주세요.");return}
  if(a.balance+amount<0){toast("잔액은 0원 미만이 될 수 없어요.");return}
  a.balance+=amount;addTx(a,"adjust","관리자 잔액 조정",Math.abs(amount),$("adjustMemo").value.trim());save();render();adminPanel();toast("잔액을 조정했어요.");
 };
 $("renameAccount").onclick=()=>{
  const a=db.accounts.find(a=>a.id===$("manageAccount").value);if(!a)return;
  show("계좌 별칭 바꾸기",`<div class="field"><label>새 별칭</label><input id="aliasNew" value="${esc(a.alias||"")}"></div><button class="btn gold wide" id="aliasSave">저장</button>`);
  $("aliasSave").onclick=()=>{a.alias=$("aliasNew").value.trim()||bank(a).name;save();render();adminPanel();toast("별칭을 바꿨어요.")};
 };
 $("deleteAccount").onclick=()=>{
  const a=db.accounts.find(a=>a.id===$("manageAccount").value);if(!a)return;
  if(db.accounts.length<=1){toast("마지막 계좌는 삭제할 수 없어요.");return}
  show("계좌를 삭제할까요?",`<div class="confirm"><strong>${esc(a.number)}</strong>${esc(bank(a).name)}</div><button class="btn wide" style="color:var(--red)" id="yesDeleteAccount">삭제하기</button><button class="btn wide" style="margin-top:8px" id="noDeleteAccount">취소</button>`);
  $("yesDeleteAccount").onclick=()=>{
   db.accounts=db.accounts.filter(x=>x.id!==a.id);db.transactions=db.transactions.filter(t=>t.accountId!==a.id);delete passes[a.id];favs=favs.filter(x=>x!==a.id);
   accountId="";save();render();adminPanel();toast("계좌를 삭제했어요.");
  };
  $("noDeleteAccount").onclick=adminPanel;
 };
 $("deletePersonGo").onclick=()=>{
  const pid=$("deletePerson").value,del=db.accounts.filter(a=>a.personId===pid);
  if(db.people.length<=1){toast("마지막 사용자는 삭제할 수 없어요.");return}
  if(db.accounts.length-del.length<1){toast("마지막 계좌는 남겨야 해요.");return}
  show("사용자를 삭제할까요?",`<div class="confirm"><strong>${esc(db.people.find(p=>p.id===pid)?.name)}</strong>관련 계좌 ${del.length}개도 삭제돼요.</div><button class="btn wide" style="color:var(--red)" id="yesDeletePerson">삭제하기</button><button class="btn wide" style="margin-top:8px" id="noDeletePerson">취소</button>`);
  $("yesDeletePerson").onclick=()=>{
   const ids=del.map(a=>a.id);db.accounts=db.accounts.filter(a=>a.personId!==pid);db.transactions=db.transactions.filter(t=>!ids.includes(t.accountId));ids.forEach(x=>delete passes[x]);favs=favs.filter(x=>!ids.includes(x));
   db.people=db.people.filter(p=>p.id!==pid);personIndex=0;accountId="";save();render();adminPanel();toast("사용자를 삭제했어요.");
  };
  $("noDeletePerson").onclick=adminPanel;
 };
 $("adminExport").onclick=exportData;
 $("adminImport").onclick=()=>$("restoreFile").click();
 $("resetAll").onclick=()=>{
  show("전체 초기화",`<div class="notice">모든 계좌와 거래 내역이 초기화돼요. 확인하려면 RESET을 입력해 주세요.</div><div class="field"><input id="resetText" placeholder="RESET"></div><button class="btn wide" style="color:var(--red)" id="resetGo">초기화하기</button>`);
  $("resetGo").onclick=()=>{
   if($("resetText").value!=="RESET"){toast("RESET을 입력해 주세요.");return}
   db=JSON.parse(JSON.stringify(initialDB));passes={};favs=[];personIndex=0;accountId="";localStorage.removeItem(ADMINKEY);save();adminOn=false;closeModal();render();toast("초기화됐어요.");
  };
 };
}
render();
})();
</script>
</body>
</html>
