<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가상 통장</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f9;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#20242c;
}

.wrap{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:22px 18px 70px;
  overflow:hidden;
}

.badge{
  display:inline-block;
  background:#fff1c9;
  color:#856300;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

h1{
  margin:14px 0 18px;
  font-size:25px;
}

.bank-slider{
  display:flex;
  align-items:center;
  gap:8px;
}

.arrow{
  width:38px;
  height:38px;
  min-width:38px;
  border:0;
  border-radius:50%;
  background:#eef0f5;
  font-size:23px;
  cursor:pointer;
}

.card{
  flex:1;
  min-width:0;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  border-radius:23px;
  padding:23px 20px;
  box-shadow:0 12px 28px #667eea33;
}

.owner{
  font-size:14px;
  opacity:.88;
}

.balance{
  font-size:32px;
  font-weight:800;
  margin-top:13px;
  white-space:nowrap;
}

.account-number{
  margin-top:15px;
  font-size:12px;
  opacity:.8;
  word-break:break-all;
}

.page{
  text-align:center;
  margin-top:10px;
  color:#999;
  font-size:12px;
}

.send{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  margin-top:17px;
  background:#111827;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.panel{
  display:none;
  margin-top:17px;
  padding:20px;
  border:1px solid #e6e8ed;
  border-radius:19px;
  background:#fafbfc;
}

.panel.show{
  display:block;
}

h2{
  font-size:19px;
  margin:0 0 15px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d9dce3;
  border-radius:11px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#667eea;
}

.confirm{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  margin-top:16px;
  background:#667eea;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancel{
  width:100%;
  border:0;
  background:transparent;
  color:#777;
  padding:11px;
  cursor:pointer;
}

.msg{
  display:none;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  font-size:13px;
}

.ok{
  display:block;
  background:#e8f8ee;
  color:#19743c;
}

.err{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.history{
  margin-top:25px;
}

.empty{
  text-align:center;
  color:#999;
  padding:25px 0;
  font-size:14px;
}

.item{
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.name{
  font-weight:bold;
}

.amount{
  font-weight:bold;
}

.minus{
  color:#d94b4b;
}

.plus{
  color:#25864a;
}

.info{
  margin-top:5px;
  color:#999;
  font-size:12px;
}

.admin-btn{
  position:fixed;
  right:7px;
  bottom:7px;
  border:0;
  background:#ddd;
  color:#666;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  opacity:.65;
  z-index:1000;
  cursor:pointer;
}

.admin-panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.admin-box{
  width:calc(100% - 36px);
  max-width:380px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:21px;
}

.admin-box h2{
  margin-bottom:16px;
}

.admin-box p{
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px;
}

.admin-box input{
  margin-bottom:4px;
}

.admin-box button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  margin-top:7px;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.gray{
  background:#eee !important;
  color:#555 !important;
}

.red{
  background:#e54848 !important;
}

.admin-balance{
  font-size:25px;
  font-weight:bold;
  margin:7px 0 15px;
}

.admin-account{
  padding:13px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.admin-account button{
  margin-top:8px;
}

small{
  color:#888;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="badge">DEMO · 가상 통장</div>

  <h1>내 통장</h1>

  <div class="bank-slider">

    <button class="arrow" onclick="previousBank()">‹</button>

    <div class="card">

      <div class="owner" id="owner">
        강리노님의 통장
      </div>

      <div class="balance" id="balance">
        100,000원
      </div>

      <div class="account-number" id="accountNumber">
        계좌번호 482-731-905164
      </div>

    </div>

    <button class="arrow" onclick="nextBank()">›</button>

  </div>

  <div class="page" id="page">
    1 / 1
  </div>


  <button class="send" onclick="openSend()">
    송금하기
  </button>


  <!-- 송금창 -->

  <div class="panel" id="sendPanel">

    <h2>💸 가상 송금</h2>

    <label>받는 분 계좌번호</label>

    <input
      id="receiverAccount"
      inputmode="numeric"
      placeholder="예: 482-731-905164"
    >

    <label>송금 금액</label>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="송금할 금액"
    >

    <label>내 통장 비밀번호</label>

    <input
      id="sendPassword"
      type="password"
      inputmode="numeric"
      placeholder="비밀번호"
    >

    <button class="confirm" onclick="sendMoney()">
      송금하기
    </button>

    <button class="cancel" onclick="closeSend()">
      취소
    </button>

    <div id="message" class="msg"></div>

  </div>


  <!-- 거래 내역 -->

  <div class="history">

    <h2>최근 거래 내역</h2>

    <div id="historyList">
      <div class="empty">
        아직 거래 내역이 없습니다.
      </div>
    </div>

  </div>

</div>


<!-- 관리자 버튼 -->

<button class="admin-btn" onclick="openAdmin()">
  관리자
</button>


<!-- 관리자 창 -->

<div class="admin-panel" id="adminPanel">

  <div class="admin-box">

    <!-- 관리자 로그인 -->

    <div id="loginArea">

      <h2>🔐 관리자</h2>

      <p>관리자 비밀번호</p>

      <input
        id="adminPw"
        type="password"
        placeholder="비밀번호"
      >

      <button onclick="loginAdmin()">
        확인
      </button>

      <div
        id="pwError"
        style="color:#e53935;font-size:13px;margin-top:7px">
      </div>

      <button class="gray" onclick="closeAdmin()">
        닫기
      </button>

    </div>


    <!-- 관리자 기능 -->

    <div id="controlArea" style="display:none">

      <h2>⚙️ 통장 관리</h2>

      <p>현재 선택된 통장</p>

      <div id="selectedAdminName">
        강리노님의 통장
      </div>

      <div class="admin-balance" id="adminBalance">
        100,000원
      </div>


      <!-- 잔액 변경 -->

      <p>잔액 변경</p>

      <input
        id="newBalance"
        type="number"
        min="0"
        placeholder="새 잔액"
      >

      <button onclick="changeBalance()">
        잔액 변경
      </button>


      <!-- 새 통장 -->

      <p>새 통장 만들기</p>

      <input
        id="newName"
        placeholder="통장 주인 이름"
      >

      <input
        id="newAmount"
        type="number"
        min="0"
        placeholder="초기 잔액"
      >

      <input
        id="newAccount"
        placeholder="계좌번호 (비워두면 랜덤)"
      >

      <input
        id="newPassword"
        type="password"
        placeholder="통장 비밀번호"
      >

      <button onclick="addBank()">
        ＋ 새 통장 만들기
      </button>


      <!-- 통장 목록 -->

      <div style="margin-top:20px">

        <p>통장 목록</p>

        <div id="adminList"></div>

      </div>


      <button class="gray" onclick="closeAdmin()">
        닫기
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   가상 통장 데이터
========================= */

let banks = [

  {
    name:"강리노",
    account:"482-731-905164",
    password:"1234",
    balance:100000,
    history:[]
  }

];

let currentBank = 0;


/* =========================
   화면 업데이트
========================= */

function updateBank(){

  const bank = banks[currentBank];

  document.getElementById("owner").textContent =
    bank.name + "님의 통장";

  document.getElementById("balance").textContent =
    bank.balance.toLocaleString("ko-KR") + "원";

  document.getElementById("accountNumber").textContent =
    "계좌번호 " + bank.account;

  document.getElementById("page").textContent =
    (currentBank + 1) + " / " + banks.length;

  updateHistory();

  updateAdminInfo();

}


/* =========================
   다음 통장
========================= */

function nextBank(){

  if(banks.length <= 1) return;

  currentBank++;

  if(currentBank >= banks.length){
    currentBank=0;
  }

  closeSend();

  updateBank();

}


/* =========================
   이전 통장
========================= */

function previousBank(){

  if(banks.length <= 1) return;

  currentBank--;

  if(currentBank < 0){
    currentBank=banks.length-1;
  }

  closeSend();

  updateBank();

}


/* =========================
   송금창
========================= */

function openSend(){

  document
    .getElementById("sendPanel")
    .classList.add("show");

  document
    .getElementById("message")
    .className="msg";

}


function closeSend(){

  document
    .getElementById("sendPanel")
    .classList.remove("show");

}


/* =========================
   메시지
========================= */

function showMessage(text,good){

  const box =
    document.getElementById("message");

  box.className =
    "msg " + (good ? "ok" : "err");

  box.textContent=text;

}


/* =========================
   가상 계좌 찾기
========================= */

function findBank(account){

  return banks.find(
    bank => bank.account === account
  );

}


/* =========================
   가상 송금
========================= */

function sendMoney(){

  const sender = banks[currentBank];

  const receiverAccount =
    document
      .getElementById("receiverAccount")
      .value.trim();

  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );

  const password =
    document
      .getElementById("sendPassword")
      .value;


  if(!receiverAccount){

    showMessage(
      "받는 통장의 계좌번호를 입력해주세요.",
      false
    );

    return;
  }


  const receiver =
    findBank(receiverAccount);


  if(!receiver){

    showMessage(
      "등록되지 않은 가상 계좌입니다.",
      false
    );

    return;
  }


  if(receiver === sender){

    showMessage(
      "현재 통장으로는 송금할 수 없습니다.",
      false
    );

    return;
  }


  if(!amount || amount <= 0){

    showMessage(
      "송금 금액을 입력해주세요.",
      false
    );

    return;
  }


  if(amount > sender.balance){

    showMessage(
      "잔액이 부족합니다.",
      false
    );

    return;
  }


  if(password !== sender.password){

    showMessage(
      "통장 비밀번호가 올바르지 않습니다.",
      false
    );

    return;
  }


  /* 돈 이동 */

  sender.balance -= amount;

  receiver.balance += amount;


  const time =
    new Date().toLocaleTimeString(
      "ko-KR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  /* 보내는 통장 */

  sender.history.unshift({

    type:"send",

    name:receiver.name,

    account:receiver.account,

    amount:amount,

    time:time

  });


  /* 받는 통장 */

  receiver.history.unshift({

    type:"receive",

    name:sender.name,

    account:sender.account,

    amount:amount,

    time:time

  });


  updateBank();


  showMessage(
    receiver.name +
    "님의 통장으로 " +
    amount.toLocaleString("ko-KR") +
    "원을 송금했습니다.",
    true
  );


  document.getElementById(
    "receiverAccount"
  ).value="";

  document.getElementById(
    "amount"
  ).value="";

  document.getElementById(
    "sendPassword"
  ).value="";

}


/* =========================
   HTML 안전 처리
========================= */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   거래 내역
========================= */

function updateHistory(){

  const bank=banks[currentBank];

  const list=
    document.getElementById("historyList");


  if(bank.history.length===0){

    list.innerHTML=
      '<div class="empty">아직 거래 내역이 없습니다.</div>';

    return;

  }


  list.innerHTML=
    bank.history.map(item=>`

      <div class="item">

        <div class="row">

          <span class="name">
            ${item.type==="send" ? "송금 → " : "입금 ← "}
            ${escapeHTML(item.name)}
          </span>

          <span class="amount ${
            item.type==="send" ? "minus" : "plus"
          }">

            ${item.type==="send" ? "-" : "+"}
            ${item.amount.toLocaleString("ko-KR")}원

          </span>

        </div>

        <div class="info">
          ${escapeHTML(item.account)}
          · ${item.time}
        </div>

      </div>

    `).join("");

}


/* =========================
   관리자 열기
========================= */

function openAdmin(){

  document.getElementById(
    "adminPanel"
  ).style.display="flex";

  document.getElementById(
    "loginArea"
  ).style.display="block";

  document.getElementById(
    "controlArea"
  ).style.display="none";

  document.getElementById(
    "adminPw"
  ).value="";

}


/* =========================
   관리자 로그인
========================= */

function loginAdmin(){

  const pw =
    document.getElementById(
      "adminPw"
    ).value;


  if(pw==="5555000"){

    document.getElementById(
      "loginArea"
    ).style.display="none";

    document.getElementById(
      "controlArea"
    ).style.display="block";

    updateAdminInfo();

  }

  else{

    document.getElementById(
      "pwError"
    ).textContent=
      "비밀번호가 올바르지 않습니다.";

  }

}


/* =========================
   관리자 정보
========================= */

function updateAdminInfo(){

  const bank=banks[currentBank];

  document.getElementById(
    "selectedAdminName"
  ).textContent=
    bank.name+"님의 통장";

  document.getElementById(
    "adminBalance"
  ).textContent=
    bank.balance.toLocaleString("ko-KR")
    +"원";

  updateAdminList();

}


/* =========================
   잔액 변경
========================= */

function changeBalance(){

  const value=
    Number(
      document.getElementById(
        "newBalance"
      ).value
    );


  if(!Number.isFinite(value)||value<0){

    alert(
      "0원 이상의 금액을 입력해주세요."
    );

    return;
  }


  banks[currentBank].balance=
    Math.floor(value);


  document.getElementById(
    "newBalance"
  ).value="";


  updateBank();


  alert(
    "가상 잔액이 변경되었습니다."
  );

}


/* =========================
   랜덤 계좌번호
========================= */

function createAccountNumber(){

  let number="";

  for(let i=0;i<12;i++){

    number +=
      Math.floor(
        Math.random()*10
      );

  }


  return (
    number.slice(0,3)
    +"-"+
    number.slice(3,6)
    +"-"+
    number.slice(6)
  );

}


/* =========================
   새 통장 만들기
========================= */

function addBank(){

  const name=
    document.getElementById(
      "newName"
    ).value.trim();


  const amount=
    Number(
      document.getElementById(
        "newAmount"
      ).value
    );


  let account=
    document.getElementById(
      "newAccount"
    ).value.trim();


  const password=
    document.getElementById(
      "newPassword"
    ).value;


  if(!name){

    alert(
      "통장 주인 이름을 입력해주세요."
    );

    return;
  }


  if(
    !Number.isFinite(amount)
    ||
    amount<0
  ){

    alert(
      "올바른 초기 잔액을 입력해주세요."
    );

    return;
  }


  if(!password){

    alert(
      "통장 비밀번호를 설정해주세요."
    );

    return;
  }


  /* 계좌번호를 안 넣으면 랜덤 */

  if(!account){

    account=
      createAccountNumber();

  }


  /* 중복 계좌번호 검사 */

  if(
    banks.some(
      bank=>bank.account===account
    )
  ){

    alert(
      "이미 사용 중인 계좌번호입니다."
    );

    return;
  }


  banks.push({

    name:name,

    account:account,

    password:password,

    balance:Math.floor(amount),

    history:[]

  });


  currentBank=banks.length-1;


  document.getElementById(
    "newName"
  ).value="";

  document.getElementById(
    "newAmount"
  ).value="";

  document.getElementById(
    "newAccount"
  ).value="";

  document.getElementById(
    "newPassword"
  ).value="";


  updateBank();


  alert(
    name+
    "님의 가상 통장이 만들어졌습니다.\n"+
    "계좌번호: "+account
  );

}


/* =========================
   관리자 통장 목록
========================= */

function updateAdminList(){

  const list=
    document.getElementById(
      "adminList"
    );


  list.innerHTML=
    banks.map(
      (bank,index)=>`

        <div class="admin-account">

          <b>
            ${escapeHTML(bank.name)}님의 통장
          </b>

          <br>

          계좌번호:
          ${escapeHTML(bank.account)}

          <br>

          잔액:
          ${bank.balance.toLocaleString("ko-KR")}원

          <br>

          <small>
            비밀번호 설정됨
          </small>

          <button
            onclick="selectBank(${index})">
            이 통장 보기
          </button>

          <button
            class="red"
            onclick="deleteBank(${index})">
            통장 삭제
          </button>

        </div>

      `
    ).join("");

}


/* =========================
   통장 선택
========================= */

function selectBank(index){

  currentBank=index;

  updateBank();

}


/* =========================
   통장 삭제
========================= */

function deleteBank(index){

  const bank=banks[index];


  if(
    !confirm(
      bank.name+
      "님의 가상 통장을 삭제할까요?"
    )
  ){

    return;
  }


  banks.splice(index,1);


  if(banks.length===0){

    banks.push({

      name:"강리노",

      account:"482-731-905164",

      password:"1234",

      balance:100000,

      history:[]

    });

  }


  if(currentBank>=banks.length){

    currentBank=
      banks.length-1;

  }


  updateBank();


  alert(
    "가상 통장이 삭제되었습니다."
  );

}


/* =========================
   관리자 닫기
========================= */

function closeAdmin(){

  document.getElementById(
    "adminPanel"
  ).style.display="none";

}


/* 시작 */

updateBank();

</script>

</body>
</html>
