<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상 통장</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f9;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#20242c;
}

.wrap{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:white;
  padding:24px 20px 60px;
}

.badge{
  display:inline-block;
  background:#fff1c9;
  color:#856300;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
}

h1{
  font-size:25px;
  margin:14px 0 20px;
}

.card{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 12px 28px #667eea33;
}

.small{
  font-size:14px;
  opacity:.85;
}

.balance{
  font-size:35px;
  font-weight:800;
  margin-top:12px;
}

.num{
  margin-top:14px;
  font-size:13px;
  opacity:.8;
}

.send{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin-top:18px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.send:active,
.confirm:active{
  transform:scale(.98);
}

.panel{
  display:none;
  margin-top:18px;
  padding:20px;
  border:1px solid #e6e8ed;
  border-radius:20px;
  background:#fafbfc;
}

.panel.show{
  display:block;
}

h2{
  font-size:19px;
  margin:0 0 16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d9dce3;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#667eea;
}

.confirm{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:17px;
  background:#667eea;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.cancel{
  width:100%;
  border:0;
  background:transparent;
  color:#777;
  padding:12px;
  cursor:pointer;
}

.msg{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
}

.ok{
  display:block;
  background:#e8f8ee;
  color:#19743c;
}

.err{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.history{
  margin-top:25px;
}

.empty{
  text-align:center;
  color:#999;
  padding:24px 0;
  font-size:14px;
}

.item{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.row{
  display:flex;
  justify-content:space-between;
}

.name{
  font-weight:bold;
}

.amount{
  color:#d94b4b;
  font-weight:bold;
}

.info{
  font-size:12px;
  color:#999;
  margin-top:5px;
}

.reset{
  width:100%;
  border:0;
  background:transparent;
  color:#777;
  padding:12px;
  margin-top:10px;
}

/* 관리자 버튼 */
.admin-btn{
  position:fixed;
  right:8px;
  bottom:8px;
  border:0;
  background:#d9d9d9;
  color:#666;
  font-size:10px;
  padding:5px 8px;
  border-radius:8px;
  opacity:.65;
  cursor:pointer;
  z-index:999;
}

/* 관리자 창 */
.admin-panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.admin-box{
  width:calc(100% - 40px);
  max-width:350px;
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.admin-box h2{
  margin:0 0 18px;
}

.admin-box p{
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px;
}

.admin-box input{
  width:100%;
  padding:13px;
  margin:0;
}

.admin-box button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:8px;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.admin-balance{
  font-size:27px;
  font-weight:bold;
  margin:10px 0 18px;
}

.admin-close{
  background:#eee !important;
  color:#555 !important;
}

#pwError{
  color:#e53935;
  font-size:13px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="badge">DEMO · 가상 송금</div>

  <h1>내 통장</h1>

  <div class="card">
    <div class="small">남장재님의 통장</div>

    <div class="balance" id="balance">
      100,000원
    </div>

    <div class="num">
      가상계좌 123-456-789012
    </div>
  </div>

  <button class="send" onclick="openSend()">
    송금하기
  </button>


  <!-- 송금 화면 -->
  <div class="panel" id="sendPanel">

    <h2>송금하기</h2>

    <label>받는 분</label>
    <input
      id="receiver"
      type="text"
      placeholder="이름을 입력하세요"
    >

    <label>계좌번호</label>
    <input
      id="account"
      type="text"
      inputmode="numeric"
      placeholder="계좌번호를 입력하세요"
    >

    <label>송금 금액</label>
    <input
      id="amount"
      type="number"
      min="1"
      placeholder="금액을 입력하세요"
    >

    <button class="confirm" onclick="sendMoney()">
      송금하기
    </button>

    <button class="cancel" onclick="closeSend()">
      취소
    </button>

    <div id="message" class="msg"></div>

  </div>


  <!-- 송금 내역 -->
  <div class="history">

    <h2>최근 송금 내역</h2>

    <div id="historyList">
      <div class="empty">
        아직 송금 내역이 없습니다.
      </div>
    </div>

  </div>


  <button class="reset" onclick="resetAccount()">
    잔액 100,000원으로 초기화
  </button>

</div>


<!-- 작은 관리자 버튼 -->
<button class="admin-btn" onclick="openAdmin()">
  관리자
</button>


<!-- 관리자 창 -->
<div class="admin-panel" id="adminPanel">

  <div class="admin-box">

    <!-- 로그인 -->
    <div id="loginArea">

      <h2>🔐 관리자</h2>

      <p>관리자 비밀번호</p>

      <input
        id="adminPw"
        type="password"
        placeholder="비밀번호"
      >

      <button onclick="loginAdmin()">
        확인
      </button>

      <div id="pwError"></div>

      <button
        class="admin-close"
        onclick="closeAdmin()"
      >
        닫기
      </button>

    </div>


    <!-- 관리자 기능 -->
    <div id="controlArea" style="display:none;">

      <h2>⚙️ 잔액 관리</h2>

      <p>현재 잔액</p>

      <div
        id="adminBalance"
        class="admin-balance"
      >
        100,000원
      </div>

      <p>새 잔액</p>

      <input
        id="newBalance"
        type="number"
        min="0"
        placeholder="금액 입력"
      >

      <button onclick="changeBalance()">
        잔액 변경
      </button>

      <button
        class="admin-close"
        onclick="closeAdmin()"
      >
        닫기
      </button>

    </div>

  </div>

</div>


<script>

let balance = 100000;

let history = [];


/* 잔액 표시 */
function updateBalance(){

  document.getElementById("balance").textContent =
    balance.toLocaleString("ko-KR") + "원";

  document.getElementById("adminBalance").textContent =
    balance.toLocaleString("ko-KR") + "원";
}


/* 송금창 열기 */
function openSend(){

  document
    .getElementById("sendPanel")
    .classList.add("show");

  document.getElementById("message").className = "msg";

}


/* 송금창 닫기 */
function closeSend(){

  document
    .getElementById("sendPanel")
    .classList.remove("show");

}


/* 메시지 */
function showMessage(text, success){

  const msg =
    document.getElementById("message");

  msg.className =
    "msg " + (success ? "ok" : "err");

  msg.textContent = text;

}


/* 송금 */
function sendMoney(){

  const receiver =
    document.getElementById("receiver")
    .value.trim();

  const account =
    document.getElementById("account")
    .value.trim();

  const amount =
    Number(
      document.getElementById("amount")
      .value
    );


  if(!receiver){

    showMessage(
      "받는 분 이름을 입력해주세요.",
      false
    );

    return;
  }


  if(!account){

    showMessage(
      "계좌번호를 입력해주세요.",
      false
    );

    return;
  }


  if(!amount || amount <= 0){

    showMessage(
      "송금 금액을 입력해주세요.",
      false
    );

    return;
  }


  if(amount > balance){

    showMessage(
      "잔액이 부족합니다.",
      false
    );

    return;
  }


  /* 실제 송금 없이 가상 잔액만 차감 */

  balance -= amount;


  history.unshift({

    receiver:receiver,

    account:account,

    amount:amount,

    time:new Date()
      .toLocaleTimeString(
        "ko-KR",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )

  });


  updateBalance();

  updateHistory();


  showMessage(
    "가상 송금이 완료되었습니다!",
    true
  );


  document.getElementById("receiver").value = "";

  document.getElementById("account").value = "";

  document.getElementById("amount").value = "";

}


/* HTML 안전 처리 */
function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* 송금 내역 */
function updateHistory(){

  const list =
    document.getElementById("historyList");


  if(history.length === 0){

    list.innerHTML =
      '<div class="empty">아직 송금 내역이 없습니다.</div>';

    return;

  }


  list.innerHTML =
    history.map(item => `

      <div class="item">

        <div class="row">

          <span class="name">
            ${escapeHTML(item.receiver)}
          </span>

          <span class="amount">
            -${item.amount.toLocaleString("ko-KR")}원
          </span>

        </div>

        <div class="info">
          ${escapeHTML(item.account)}
          ·
          ${item.time}
        </div>

      </div>

    `).join("");

}


/* 초기화 */
function resetAccount(){

  balance = 100000;

  history = [];

  updateBalance();

  updateHistory();

  closeSend();

}


/* 관리자 창 */
function openAdmin(){

  document
    .getElementById("adminPanel")
    .style.display = "flex";


  document
    .getElementById("loginArea")
    .style.display = "block";


  document
    .getElementById("controlArea")
    .style.display = "none";


  document
    .getElementById("adminPw")
    .value = "";


  document
    .getElementById("pwError")
    .textContent = "";

}


/* 관리자 로그인 */
function loginAdmin(){

  const pw =
    document
      .getElementById("adminPw")
      .value;


  if(pw === "5555000"){

    document
      .getElementById("loginArea")
      .style.display = "none";


    document
      .getElementById("controlArea")
      .style.display = "block";


    updateBalance();

  }else{

    document
      .getElementById("pwError")
      .textContent =
        "비밀번호가 올바르지 않습니다.";

  }

}


/* 관리자 잔액 변경 */
function changeBalance(){

  const value =
    Number(
      document
        .getElementById("newBalance")
        .value
    );


  if(
    !Number.isFinite(value) ||
    value < 0
  ){

    alert(
      "0원 이상의 금액을 입력해주세요."
    );

    return;

  }


  balance = Math.floor(value);

  updateBalance();


  document
    .getElementById("newBalance")
    .value = "";


  alert(
    "가상 잔액이 변경되었습니다."
  );

}


/* 관리자 닫기 */
function closeAdmin(){

  document
    .getElementById("adminPanel")
    .style.display = "none";

}


/* 처음 실행 */
updateBalance();

</script>

</body>
</html>
