<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>가상은행</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f6fa;
  --white:#fff;
  --text:#20222a;
  --sub:#777d8c;
  --line:#e8eaf0;
  --primary:#5c63f5;
  --primary2:#8062ff;
  --danger:#ed5360;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at 10% 0%,rgba(113,100,255,.13),transparent 28%),
    radial-gradient(circle at 100% 20%,rgba(70,170,255,.10),transparent 26%),
    var(--bg);
  color:var(--text);
  font-family:"Noto Sans KR",sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:460px;
  min-height:100vh;
  margin:auto;
  padding:18px 14px 40px;
}

/* =========================
   상단
========================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:22px;
  background:linear-gradient(135deg,#5962f6,#8661ff);
  box-shadow:0 8px 20px rgba(92,99,245,.25);
}

.brand-title{
  font-family:"Jua",sans-serif;
  font-size:23px;
}

.brand-sub{
  color:var(--sub);
  font-size:11px;
  margin-top:1px;
}

.admin-btn{
  width:41px;
  height:41px;
  border:0;
  border-radius:13px;
  background:#fff;
  box-shadow:0 6px 18px rgba(30,35,60,.08);
  font-size:17px;
}

/* =========================
   계좌 이동
========================= */

.account-switch{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.arrow{
  width:41px;
  height:41px;
  border:0;
  border-radius:13px;
  background:#fff;
  box-shadow:0 5px 18px rgba(30,35,60,.07);
  font-size:21px;
  color:#555b6d;
}

.person-title{
  flex:1;
  min-width:0;
  text-align:center;
}

.person-name{
  font-family:"Jua",sans-serif;
  font-size:19px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.person-count{
  font-size:11px;
  color:var(--sub);
}

/* =========================
   계좌 카드
========================= */

.bank-card{
  position:relative;
  overflow:hidden;
  min-width:0;

  border-radius:28px;
  padding:24px 21px 22px;

  color:#fff;

  background:
    radial-gradient(circle at 90% 10%,rgba(255,255,255,.25),transparent 25%),
    radial-gradient(circle at 10% 100%,rgba(255,255,255,.11),transparent 30%),
    linear-gradient(135deg,#505cf5,#7659f5 55%,#9061ff);

  box-shadow:
    0 20px 45px rgba(83,78,220,.24),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.bank-card:before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-80px;
  top:-90px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
}

.bank-card:after{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  right:-125px;
  top:-125px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:50%;
}

.card-top{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
  min-width:0;
}

.bank-info{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.bank-logo{
  width:43px;
  height:43px;
  flex:0 0 43px;

  border-radius:14px;
  background:rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;

  border:1px solid rgba(255,255,255,.18);
}

.bank-name{
  font-weight:800;
  font-size:15px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.account-owner{
  font-size:11px;
  opacity:.75;
  margin-top:2px;
}

.account-label{
  position:relative;
  z-index:2;

  margin-top:25px;

  font-size:10px;
  opacity:.67;
}

.account-number{
  position:relative;
  z-index:2;

  width:100%;
  max-width:100%;
  min-width:0;

  margin-top:5px;

  font-size:14px;
  font-weight:600;
  letter-spacing:.4px;
  line-height:1.7;

  white-space:normal;

  /*
    계좌번호가 길어져도
    카드 밖으로 절대 나오지 않도록 설정
  */
  overflow-wrap:anywhere;
  word-break:break-all;
}

.balance-label{
  position:relative;
  z-index:2;

  margin-top:21px;

  font-size:11px;
  opacity:.72;
}

.balance{
  position:relative;
  z-index:2;

  margin-top:2px;

  max-width:100%;
  min-width:0;

  font-family:"Jua",sans-serif;
  font-size:34px;
  line-height:1.2;

  overflow-wrap:anywhere;
  word-break:break-word;
}

.balance small{
  font-family:"Noto Sans KR",sans-serif;
  font-size:17px;
}

/* =========================
   버튼
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.action-btn{
  height:52px;

  border:0;
  border-radius:17px;

  background:#fff;

  box-shadow:0 7px 20px rgba(31,35,55,.07);

  font-weight:700;
  font-size:14px;

  color:#333746;
}

.action-btn.primary{
  background:#252a3d;
  color:#fff;
}

/* =========================
   거래내역
========================= */

.section{
  margin-top:19px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.section-title{
  font-family:"Jua",sans-serif;
  font-size:18px;
}

.section-sub{

  font-size:11px;
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-empty{
  padding:25px;

  text-align:center;

  background:#fff;
  border-radius:18px;

  color:#9b9fac;
  font-size:13px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:11px;

  background:#fff;

  border:1px solid #f0f1f4;
  border-radius:18px;

  padding:13px;
}

.history-icon{
  width:38px;
  height:38px;
  flex:0 0 38px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.history-main{
  min-width:0;

}

.history-title{
  font-size:13px;
  font-weight:700;
}

.history-date{
  font-size:10px;
  color:#9a9eaa;
  margin-top:2px;
}

.history-money{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.plus{
  color:#5360e8;
}

.minus{
  color:#ef5361;
}

/* =========================
   모달
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;
  align-items:flex-end;
  justify-content:center;

  background:rgba(20,23,35,.48);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(460px,100%);
  max-height:92vh;
  overflow:auto;

  background:#fff;

  border-radius:28px 28px 0 0;

  padding:20px 17px 30px;

  box-shadow:0 -15px 50px rgba(0,0,0,.18);
}

.modal-title{
  font-family:"Jua",sans-serif;
  font-size:22px;
  margin-bottom:4px;
}

.modal-sub{
  font-size:11px;
  color:#9296a3;
  margin-bottom:18px;
}

.close-btn{
  float:right;

  border:0;

  background:#f3f4f7;

  width:34px;
  height:34px;

  border-radius:11px;

  font-size:17px;
}

/* =========================
   입력
========================= */

.form-group{
  margin-bottom:13px;
}

.form-label{

  font-size:11px;
  font-weight:700;

  color:#646978;

  margin-bottom:6px;
}

input,
select{

  height:46px;

.big-btn{

}

.gray-btn{

  height:46px;

  border-radius:14px;

  background:#f1f2f5;

  font-weight:700;
  color:#565b69;
}

.red-btn{
  width:100%;
  height:46px;

  border:0;
  border-radius:14px;

  background:#fff0f1;

  color:#e94e5b;

  font-weight:800;
}

/* =========================
   관리자
========================= */

.admin-card{
  background:#f8f9fc;

  border:1px solid #eceef3;

  border-radius:18px;

  padding:13px;

  margin-bottom:11px;
}

.admin-person{
  font-weight:800;
  font-size:14px;
}

.admin-bank{
  font-size:11px;
  color:#8a8f9d;
  margin-top:2px;
}

.account-list{
  display:flex;
  flex-direction:column;
  gap:7px;

  margin-top:10px;
}

.admin-account{
  width:100%;

  text-align:left;

  border:1px solid #e7e9ee;

  background:#fff;

  border-radius:13px;

  padding:11px;
}

.admin-account.selected{
  border-color:#656bf7;

  background:#f5f5ff;

  box-shadow:0 0 0 2px rgba(101,107,247,.08);
}

.admin-account-top{
  display:flex;
  justify-content:space-between;

  gap:8px;
}

.admin-account-bank{
  font-size:12px;
  font-weight:800;
}

.admin-account-money{
  font-size:12px;
  font-weight:800;
}

.admin-account-number{
  margin-top:3px;

  font-size:10px;

  color:#8e93a1;

  overflow-wrap:anywhere;
  word-break:break-all;
  white-space:normal;
}

.selected-box{
  background:#f6f6ff;

  border:1px solid #dedfff;

  border-radius:17px;

  padding:13px;

  margin-bottom:13px;
}

.selected-title{
  font-family:"Jua",sans-serif;
  font-size:16px;
}

.selected-info{
  font-size:11px;
  color:#777c8a;

  line-height:1.7;

  margin-top:4px;

  overflow-wrap:anywhere;
  word-break:break-word;
}

/* =========================
   알림
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  transform:translate(-50%,20px);

  z-index:2000;

  background:#252936;
  color:#fff;

  border-radius:14px;

  padding:11px 16px;

  font-size:12px;
  font-weight:600;

  opacity:0;
  pointer-events:none;

  transition:.22s ease;

  box-shadow:0 10px 30px rgba(0,0,0,.18);

  max-width:90%;

  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   빈 화면
========================= */

.empty{
  background:#fff;

  border-radius:20px;

  padding:35px 20px;

  text-align:center;

  color:#9296a2;
}

@media(max-width:360px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .bank-card{
    padding:21px 17px;
  }

  .balance{
    font-size:30px;
  }

}
</style>
</head>

<body>

  <div class="modal-box">

<script>

/* =========================================================
   기본 설정
========================================================= */

const STORAGE_KEY = "cute_virtual_bank_v5";

const ADMIN_PASSWORD = "5555000";


const defaultData = {

  accounts:[

    {

      id:makeId(),

      owner:"강리노",

      bank:"대한은행",

      number:"482-731-905164",

      password:"1234",

      money:100000,

      history:[]

    }

  ],

  bankLogos:{
    "대한은행":"🏦"
  },

  current:0

};


let data = loadData();

let adminSelectedAccountId = null;

let addAccountOwner = null;


/* =========================================================
   ID
========================================================= */

function makeId(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2,8);

}


/* =========================================================
   데이터 불러오기
========================================================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(!saved){

      return defaultData;

    }

    const parsed =
      JSON.parse(saved);


    if(
      !parsed.accounts ||
      !Array.isArray(parsed.accounts)
    ){

      return defaultData;

    }


    parsed.accounts.forEach(account=>{

      if(!account.id){

        account.id = makeId();

      }

      if(!account.history){

        account.history = [];

      }

    });


    if(!parsed.bankLogos){

      parsed.bankLogos = {};

    }


    return parsed;

  }catch(error){

    return defaultData;

  }

}


/* =========================================================
   저장
========================================================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   HTML 보안 처리
========================================================= */

function escapeHTML(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   금액
========================================================= */

function moneyFormat(num){

  return Number(num || 0)
    .toLocaleString("ko-KR");

}


/* =========================================================
   알림
========================================================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },2200);

}


/* =========================================================
   모달
========================================================= */

function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

}

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================================================
   은행 로고
========================================================= */

const defaultBankLogos = [

  "🏦",
  "💳",
  "🏛️",
  "💰",
  "💎",
  "🌟",
  "🐰",
  "🐻",
  "🦊",
  "🐼",
  "🌈",
  "⭐"

];


function getBankLogo(bank){

  if(!bank){

    return "🏦";

  }


  if(!data.bankLogos[bank]){

    let hash = 0;


    for(
      let i=0;
      i<bank.length;
      i++
    ){

      hash +=
        bank.charCodeAt(i);

    }


    data.bankLogos[bank] =
      defaultBankLogos[
        hash % defaultBankLogos.length
      ];


    saveData();

  }


  return data.bankLogos[bank];

}


/* =========================================================
   사람 목록
========================================================= */

function getPeople(){

  const people = [];


  data.accounts.forEach(account=>{

    if(!people.includes(account.owner)){

      people.push(account.owner);

    }

  });


  return people;

}


/* =========================================================
   특정 사람 계좌
========================================================= */

function getPersonAccounts(owner){

  return data.accounts.filter(
    account =>
      account.owner === owner
  );

}


/* =========================================================
   현재 계좌
========================================================= */

function getCurrentAccount(){

  if(!data.accounts.length){

    return null;

  }


  if(data.current < 0){

    data.current = 0;

  }


  if(
    data.current >=
    data.accounts.length
  ){

    data.current =
      data.accounts.length - 1;

  }


  return data.accounts[data.current];

}

/* =========================================================
   거래내역
========================================================= */

function renderHistory(account){

  if(
    !account.history ||
    account.history.length === 0
  ){

    return `

      <div class="history-empty">

        거래내역이 없습니다.

      </div>

    `;

  }


  return account.history
    .slice()
    .reverse()
    .map(item=>{

      const isIn =
        item.type === "in";


      return `

        <div class="history-item">

          <div class="history-icon">

            ${isIn ? "↓" : "↑"}

          </div>


          <div class="history-main">

            <div class="history-title">

              ${escapeHTML(item.title)}

            </div>


            <div class="history-date">

              ${escapeHTML(item.date)}

            </div>

          </div>


          <div
            class="history-money
            ${isIn ? "plus":"minus"}">

            ${isIn ? "+" : "-"}

            ${moneyFormat(item.amount)}원

          </div>

        </div>

      `;

    })
    .join("");

}


/* =========================================================
   계좌 이동
========================================================= */

function previousAccount(){

  if(!data.accounts.length){

    return;

  }


  data.current--;


  if(data.current < 0){

    data.current =
      data.accounts.length - 1;

  }


  saveData();

  render();

}


function nextAccount(){

  if(!data.accounts.length){

    return;

  }


  data.current++;


  if(
    data.current >=
    data.accounts.length
  ){

    data.current = 0;

  }


  saveData();

  render();

}

/* =========================================================
   송금
========================================================= */

function openSend(){

  const account =
    getCurrentAccount();


  if(!account){

    return;

  }


  updateSendBanks();


  document.getElementById(
    "sendNumber"
  ).value = "";


  document.getElementById(
    "sendAmount"
  ).value = "";


  document.getElementById(
    "sendPassword"
  ).value = "";


  openModal("sendModal");

}


function updateSendBanks(){

  const select =
    document.getElementById(
      "sendBank"
    );


  const banks = [];


  data.accounts.forEach(account=>{

    if(!banks.includes(account.bank)){

      banks.push(account.bank);

    }

  });


  select.innerHTML =
    banks.map(bank=>`

      <option
        value="${escapeHTML(bank)}">

        ${getBankLogo(bank)}
        ${escapeHTML(bank)}

      </option>

    `).join("");

}


function sendMoney(){

  const sender =
    getCurrentAccount();


  if(!sender){

    return;

  }


  const bank =
    document.getElementById(
      "sendBank"
    ).value;


  const number =
    document.getElementById(
      "sendNumber"
    ).value.trim();


  const amount =
    Number(
      document.getElementById(
        "sendAmount"
      ).value
    );


  const password =
    document.getElementById(
      "sendPassword"
    ).value;


  if(password !== sender.password){

    showToast(
      "계좌 비밀번호가 일치하지 않습니다."
    );

    return;

  }


  if(!number){

    showToast(
      "받으실 계좌번호를 입력해주세요."
    );

    return;

  }


  if(!amount || amount <= 0){

    showToast(
      "송금하실 금액을 입력해주세요."
    );

    return;

  }


  if(sender.money < amount){

    showToast(
      "현재 잔액이 부족합니다."
    );

    return;

  }


  const receiver =
    data.accounts.find(account=>

      account.bank === bank &&
      account.number === number

    );


  if(!receiver){

    showToast(
      "입금받으실 계좌를 찾을 수 없습니다."
    );

    return;

  }


  if(receiver.id === sender.id){

    showToast(
      "현재 계좌로는 송금하실 수 없습니다."
    );

    return;

  }


  sender.money -= amount;

  receiver.money += amount;


  const now = new Date();


  const date =

    now.getFullYear() + "." +

    String(
      now.getMonth()+1
    ).padStart(2,"0") + "." +

    String(
      now.getDate()
    ).padStart(2,"0") + " " +

    String(
      now.getHours()
    ).padStart(2,"0") + ":" +

    String(
      now.getMinutes()
    ).padStart(2,"0");


  sender.history.push({

    type:"out",

    title:
      `${receiver.owner}님에게 송금`,

    amount:amount,

    date:date

  });


  receiver.history.push({

    type:"in",

    title:
      `${sender.owner}님에게 입금`,

    amount:amount,

    date:date

  });


  saveData();

  closeModal("sendModal");

  render();


  showToast(
    `${moneyFormat(amount)}원 송금이 완료되었습니다.`
  );

}

/* =========================================================
   계좌번호 생성
========================================================= */

function generateAccountNumber(){

  const a =
    Math.floor(
      100 + Math.random()*900
    );


  const b =
    Math.floor(
      100 + Math.random()*900
    );


  const c =
    Math.floor(
      100000 +
      Math.random()*900000
    );


  return `${a}-${b}-${c}`;

}


function accountNumberExists(number){

  return data.accounts.some(
    account =>
      account.number === number
  );

}


/* =========================================================
   계좌 생성
========================================================= */

function createAccount(){

  let owner =
    document.getElementById(
      "newOwner"
    ).value.trim();


  let bank =
    document.getElementById(
      "newBank"
    ).value.trim();


  let number =
    document.getElementById(
      "newNumber"
    ).value.trim();


  const money =
    Number(
      document.getElementById(
        "newMoney"
      ).value
    );


  const password =
    document.getElementById(
      "newPassword"
    ).value.trim();


  if(!owner){

    showToast(
      "계좌 소유자 이름을 입력해주세요."
    );

    return;

  }


  /*
    기존 사람의 계좌를 추가하는 경우
    선택된 사람의 이름을 그대로 사용합니다.
  */

  if(addAccountOwner){

    owner =
      addAccountOwner;

  }


  /*
    은행을 입력하지 않은 경우
    기본 랜덤 은행 중 하나를 선택합니다.
  */

  if(!bank){

    const randomBanks = [

      "대한은행",
      "두리은행",
      "수난은행"

    ];


    bank =
      randomBanks[
        Math.floor(
          Math.random() *
          randomBanks.length
        )
      ];

  }


  /*
    계좌번호를 입력하지 않은 경우
    자동으로 생성합니다.
  */

  if(!number){

    do{

      number =
        generateAccountNumber();

    }while(
      accountNumberExists(number)
    );

  }


  if(accountNumberExists(number)){

    showToast(
      "이미 등록된 계좌번호입니다."
    );

    return;

  }


  if(
    isNaN(money) ||
    money < 0
  ){

    showToast(
      "올바른 초기 잔액을 입력해주세요."
    );

    return;

  }


  if(!password){

    showToast(
      "계좌 비밀번호를 입력해주세요."
    );

    return;

  }


  const newAccount = {

    id:makeId(),

    owner:owner,

    bank:bank,

    number:number,

    password:password,

    money:money,

    history:[]

  };


  data.accounts.push(
    newAccount
  );


  /*
    새로운 은행이면
    은행 로고도 자동으로 등록합니다.
  */

  getBankLogo(bank);


  data.current =
    data.accounts.length - 1;


  adminSelectedAccountId =
    newAccount.id;


  saveData();


  closeModal(
    "addAccountModal"
  );


  render();

  renderAdmin();


  showToast(
    `${owner}님의 ${bank} 계좌가 생성되었습니다.`
  );

}


/* =========================================================
   계좌 삭제
========================================================= */

function deleteSelectedAccount(){

  const account =
    data.accounts.find(
      account =>
        account.id ===
        adminSelectedAccountId
    );


  if(!account){

    return;

  }


  const ok =
    confirm(

`정말 선택된 계좌를 삭제하시겠습니까?

계좌 소유자: ${account.owner}
은행명: ${account.bank}
계좌번호: ${account.number}

삭제 후에는 복구할 수 없습니다.`

    );


  if(!ok){

    return;

  }


  data.accounts =
    data.accounts.filter(
      item =>
        item.id !== account.id
    );


  if(
    data.current >=
    data.accounts.length
  ){

    data.current =
      Math.max(
        0,
        data.accounts.length - 1
      );

  }


  if(data.accounts.length){

    adminSelectedAccountId =
      data.accounts[0].id;

  }else{

    adminSelectedAccountId =
      null;

  }


  saveData();

  render();

  renderAdmin();


  showToast(
    "계좌가 삭제되었습니다."
  );

}


/* =========================================================
   전체 데이터 초기화
========================================================= */

function resetAllData(){

  const first =
    confirm(

`전체 데이터를 초기화하시겠습니까?

모든 사람의 계좌, 잔액,
거래내역이 삭제됩니다.`

    );


  if(!first){

    return;

  }


  const second =
    confirm(

`최종 확인입니다.

전체 데이터를 정말 삭제하시겠습니까?
삭제 후에는 복구할 수 없습니다.`

    );


  if(!second){

    return;

  }


  data = {

    accounts:[],

    bankLogos:{},

    current:0

  };


  saveData();


  adminSelectedAccountId =
    null;


  render();

  renderAdmin();


  showToast(
    "전체 데이터가 초기화되었습니다."
  );

}


/* =========================================================
   시작
========================================================= */

render();

</script>
