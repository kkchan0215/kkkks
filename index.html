<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑 가상계좌</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5fb;
  color:#30313a;
  font-family:'Jua','Arial',sans-serif;
}

button,input,select{
  font-family:inherit;
}

button{cursor:pointer}

.wrap{
  width:100%;
  max-width:440px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:24px 18px 90px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:30px;
  background:#fff0bf;
  color:#806500;
  font-size:12px;
}

h1{
  margin:15px 0 20px;
  font-size:29px;
}

.slider{
  display:flex;
  align-items:center;
  gap:8px;
}

.arrow{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:#f0f1f7;
  color:#555;
  font-size:25px;
}

.card{
  flex:1;
  min-width:0;
  padding:22px;
  border-radius:27px;
  color:#fff;
  background:linear-gradient(135deg,#8297ff,#a477dc);
  box-shadow:0 15px 30px rgba(110,120,220,.22);
}

.bank-logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.22);
  font-size:20px;
}

.owner{
  margin-top:17px;
  font-size:16px;
}

.balance{
  margin-top:12px;
  font-size:33px;
  font-weight:bold;
  white-space:nowrap;
}

.account{
  margin-top:14px;
  font-size:12px;
  opacity:.8;
  word-break:break-all;
}

.page{
  text-align:center;
  margin-top:10px;
  color:#aaa;
  font-size:12px;
}

.send{
  width:100%;
  border:0;
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  background:#343743;
  color:#fff;
  font-size:18px;
}

.panel{
  display:none;
  margin-top:16px;
  padding:20px;
  border-radius:21px;
  background:#fafaff;
  border:1px solid #e8e8f0;
}

.panel.show{display:block}

h2{
  margin:0 0 15px;
  font-size:21px;
}

label{
  display:block;
  margin:13px 0 7px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:13px;
  border:1px solid #dddfea;
  outline:none;
  font-size:16px;
  background:#fff;
}

input:focus,select:focus{
  border-color:#8496ff;
}

.confirm{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#8297ff;
  color:#fff;
  font-size:16px;
}

.cancel{
  width:100%;
  padding:11px;
  border:0;
  background:transparent;
  color:#888;
}

.msg{
  display:none;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  font-size:13px;
}

.ok{
  display:block;
  background:#e7f8ee;
  color:#277348;
}

.err{
  display:block;
  background:#fff0f0;
  color:#c74343;
}

.history{
  margin-top:28px;
}

.empty{
  padding:25px 0;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

.item{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.name{font-size:15px}
.minus{color:#df6262}
.plus{color:#35a36a}

.info{
  margin-top:5px;
  color:#aaa;
  font-size:12px;
}

.admin-btn{
  position:fixed;
  right:8px;
  bottom:8px;
  z-index:1000;
  border:0;
  border-radius:10px;
  padding:6px 9px;
  background:#ddd;
  color:#666;
  font-size:10px;
  opacity:.7;
}

.admin-panel{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
}

.admin-box{
  width:calc(100% - 35px);
  max-width:400px;
  max-height:92vh;
  overflow:auto;
  padding:22px;
  border-radius:24px;
  background:#fff;
}

.admin-box p{
  margin:14px 0 7px;
  font-size:14px;
}

.admin-box button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:7px;
  background:#343743;
  color:white;
  font-size:14px;
}

.gray{
  background:#eee!important;
  color:#666!important;
}

.red{
  background:#e85b5b!important;
}

.reset{
  margin-top:20px!important;
  background:#ff7070!important;
}

.warning{
  margin-top:8px;
  padding:12px;
  border-radius:13px;
  background:#fff3d9;
  color:#876400;
  font-size:12px;
  line-height:1.6;
}

.admin-balance{
  font-size:26px;
}

.admin-account{
  padding:14px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.bank-row{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="wrap">

<div class="badge">☁️ 말랑 가상계좌</div>

<h1>내 계좌 💳</h1>

<div class="slider">

<button class="arrow" onclick="prevAccount()">‹</button>

<div class="card">

<div class="bank-logo">
<div class="logo" id="bankLogo">🏦</div>
<div id="bankName">대한은행</div>
</div>

<div class="owner" id="owner">
강리노님의 계좌
</div>

<div class="balance" id="balance">
100,000원
</div>

<div class="account" id="account">
계좌번호 482-731-905164
</div>

</div>

<button class="arrow" onclick="nextAccount()">›</button>

</div>

<div class="page" id="page">1 / 1</div>

<button class="send" onclick="openSend()">
💸 송금하기
</button>


<div class="panel" id="sendPanel">

<h2>💌 가상 송금</h2>

<label>🏦 받는 은행</label>

<select id="toBank"></select>

<label>🔢 받는 계좌번호</label>

<input
id="toAccount"
placeholder="계좌번호를 입력해줘">

<label>💰 송금 금액</label>

<input
id="amount"
type="number"
min="1"
placeholder="얼마를 보낼까?">

<label>🔐 내 계좌 비밀번호</label>

<input
id="sendPassword"
type="password"
placeholder="비밀번호">

<button class="confirm" onclick="sendMoney()">
💸 송금하기
</button>

<button class="cancel" onclick="closeSend()">
취소
</button>

<div id="message" class="msg"></div>

</div>


<div class="history">

<h2>📜 거래 내역</h2>

<div id="historyList"></div>

</div>

</div>


<button class="admin-btn" onclick="openAdmin()">
관리자
</button>


<div class="admin-panel" id="adminPanel">

<div class="admin-box">

<div id="loginArea">

<h2>🔐 관리자 공간</h2>

<p>관리자 비밀번호</p>

<input
id="adminPw"
type="password"
placeholder="비밀번호">

<button onclick="loginAdmin()">
🔓 들어가기
</button>

<div id="pwError"
style="color:#e55555;font-size:13px;margin-top:7px">
</div>

<button class="gray" onclick="closeAdmin()">
닫기
</button>

</div>


<div id="controlArea" style="display:none">

<h2>⚙️ 계좌 관리</h2>

<p>현재 계좌</p>

<div id="selectedName"></div>

<div class="admin-balance" id="adminBalance">
100,000원
</div>


<p>잔액 변경</p>

<input
id="newBalance"
type="number"
min="0"
placeholder="새 잔액">

<button onclick="changeBalance()">
💰 잔액 바꾸기
</button>


<p>새 계좌 만들기</p>

<input
id="newOwner"
placeholder="계좌 주인 이름">

<input
id="newBank"
placeholder="은행 이름 · 비워두면 랜덤">

<input
id="newAccount"
placeholder="계좌번호 · 비워두면 랜덤">

<input
id="newMoney"
type="number"
min="0"
placeholder="초기 잔액">

<input
id="newPassword"
type="password"
placeholder="계좌 비밀번호">

<input
id="newLogo"
maxlength="2"
placeholder="은행 마크 · 비워두면 자동">

<button onclick="addAccount()">
✨ 새 계좌 만들기
</button>


<p>계좌 목록</p>

<div id="accountList"></div>


<p>🏦 등록된 은행</p>

<div id="bankList"></div>


<div class="warning">
⚠️ <b>주의</b><br>
초기화하면 모든 가상 계좌,
잔액, 송금 내역, 은행 마크가
삭제되고 처음 상태로 돌아가요.
</div>

<button class="reset" onclick="resetAllData()">
🗑️ 전체 데이터 초기화
</button>

<button class="gray" onclick="closeAdmin()">
닫기
</button>

</div>

</div>

</div>


<script>

const STORAGE_KEY="cute_virtual_bank_v2";

const defaultLogos=[
"🏦","🔵","🟢","🟣","🟠",
"🔷","⭐","✨","💠","🌟"
];

const defaultData={
accounts:[
{
owner:"강리노",
bank:"대한은행",
number:"482-731-905164",
password:"1234",
money:100000,
history:[]
}
],
bankLogos:{
"대한은행":"🏦"
},
current:0
};


let data=null;

try{
data=JSON.parse(
localStorage.getItem(STORAGE_KEY)
);
}catch(e){
data=null;
}

if(!data){
data=defaultData;
}

let accounts=data.accounts||[];
let bankLogos=data.bankLogos||{};
let current=data.current||0;


if(accounts.length===0){
accounts=JSON.parse(
JSON.stringify(defaultData.accounts)
);
}

if(!bankLogos["대한은행"]){
bankLogos["대한은행"]="🏦";
}

if(current>=accounts.length){
current=0;
}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify({
accounts,
bankLogos,
current
})
);

}


function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function getBankLogo(bank){

if(bankLogos[bank]){
return bankLogos[bank];
}

const used=Object.values(bankLogos);

let logo=defaultLogos.find(
x=>!used.includes(x)
);

if(!logo){
logo="🏦";
}

bankLogos[bank]=logo;

saveData();

return logo;

}


function getBanks(){

const names=[];

accounts.forEach(a=>{
if(!names.includes(a.bank)){
names.push(a.bank);
}
});

return names;

}


function updateBankSelect(){

const select=
document.getElementById("toBank");

const banks=getBanks();

select.innerHTML=
banks.map(bank=>`

<option value="${escapeHTML(bank)}">
${getBankLogo(bank)} ${escapeHTML(bank)}
</option>

`).join("");

}


function update(){

const a=accounts[current];

document.getElementById("bankLogo").textContent=
getBankLogo(a.bank);

document.getElementById("bankName").textContent=
a.bank;

document.getElementById("owner").textContent=
a.owner+"님의 계좌";

document.getElementById("balance").textContent=
a.money.toLocaleString("ko-KR")+"원";

document.getElementById("account").textContent=
"계좌번호 "+a.number;

document.getElementById("page").textContent=
(current+1)+" / "+accounts.length;

updateBankSelect();

renderHistory();
updateAdmin();
saveData();

}


function nextAccount(){

if(accounts.length<2)return;

current++;

if(current>=accounts.length){
current=0;
}

closeSend();
update();

}


function prevAccount(){

if(accounts.length<2)return;

current--;

if(current<0){
current=accounts.length-1;
}

closeSend();
update();

}


function openSend(){

updateBankSelect();

document
.getElementById("sendPanel")
.classList.add("show");

}


function closeSend(){

document
.getElementById("sendPanel")
.classList.remove("show");

}


function showMessage(text,good){

const box=
document.getElementById("message");

box.className=
"msg "+(good?"ok":"err");

box.textContent=text;

}


function sendMoney(){

const sender=accounts[current];

const bank=
document.getElementById("toBank").value;

const number=
document.getElementById("toAccount")
.value.trim();

const money=
Number(
document.getElementById("amount").value
);

const password=
document.getElementById("sendPassword")
.value;


const receiver=
accounts.find(
a=>a.bank===bank &&
a.number===number
);


if(!receiver){

showMessage(
"해당 은행의 계좌를 찾을 수 없어 😢",
false
);

return;

}


if(receiver===sender){

showMessage(
"현재 계좌로는 송금할 수 없어.",
false
);

return;

}


if(!money||money<=0){

showMessage(
"송금 금액을 입력해줘.",
false
);

return;

}


if(money>sender.money){

showMessage(
"잔액이 부족해 😢",
false
);

return;

}


if(password!==sender.password){

showMessage(
"비밀번호가 맞지 않아.",
false
);

return;

}


sender.money-=money;
receiver.money+=money;


const time=
new Date().toLocaleTimeString(
"ko-KR",
{
hour:"2-digit",
minute:"2-digit"
}
);


sender.history.unshift({

type:"send",
name:receiver.owner,
bank:receiver.bank,
number:receiver.number,
money,
time

});


receiver.history.unshift({

type:"receive",
name:sender.owner,
bank:sender.bank,
number:sender.number,
money,
time

});


saveData();
update();


showMessage(
"✨ "+receiver.owner+
"님의 "+receiver.bank+
" 계좌로 "+
money.toLocaleString("ko-KR")+
"원을 보냈어!",
true
);


document.getElementById("toAccount").value="";
document.getElementById("amount").value="";
document.getElementById("sendPassword").value="";

}


function renderHistory(){

const box=
document.getElementById("historyList");

const a=accounts[current];


if(!a.history||a.history.length===0){

box.innerHTML=
'<div class="empty">아직 거래 내역이 없어 ☁️</div>';

return;

}


box.innerHTML=a.history.map(x=>`

<div class="item">

<div class="row">

<span class="name">

${
x.type==="send"
?"💸 송금 → "
:"💰 입금 ← "
}

${escapeHTML(x.name)}

</span>

<span class="${
x.type==="send"
?"minus"
:"plus"
}">

${
x.type==="send"
?"-"
:"+"
}

${x.money.toLocaleString("ko-KR")}원

</span>

</div>

<div class="info">

${escapeHTML(x.bank)}
 ·
${escapeHTML(x.number)}
 ·
${escapeHTML(x.time)}

</div>

</div>

`).join("");

}


function openAdmin(){

document.getElementById("adminPanel")
.style.display="flex";

document.getElementById("loginArea")
.style.display="block";

document.getElementById("controlArea")
.style.display="none";

document.getElementById("adminPw").value="";

}


function loginAdmin(){

const pw=
document.getElementById("adminPw").value;


if(pw==="5555000"){

document.getElementById("loginArea")
.style.display="none";

document.getElementById("controlArea")
.style.display="block";

updateAdmin();

}else{

document.getElementById("pwError")
.textContent=
"비밀번호가 틀렸어 😢";

}

}


function updateAdmin(){

const a=accounts[current];

document.getElementById("selectedName")
.textContent=
a.owner+"님의 계좌";

document.getElementById("adminBalance")
.textContent=
a.money.toLocaleString("ko-KR")+"원";


document.getElementById("accountList")
.innerHTML=
accounts.map((x,i)=>`

<div class="admin-account">

<b>
${escapeHTML(x.owner)}님의 계좌
</b>

<br>

${getBankLogo(x.bank)}
${escapeHTML(x.bank)}

<br>

${escapeHTML(x.number)}

<br>

잔액:
${x.money.toLocaleString("ko-KR")}원

<button onclick="selectAccount(${i})">
👀 이 계좌 보기
</button>

<button
class="red"
onclick="deleteAccount(${i})">
🗑️ 계좌 삭제
</button>

</div>

`).join("");


document.getElementById("bankList")
.innerHTML=
getBanks().map(bank=>`

<div class="bank-row">

<span>
${getBankLogo(bank)}
</span>

<b>
${escapeHTML(bank)}
</b>

</div>

`).join("");

}


function changeBalance(){

const value=
Number(
document.getElementById("newBalance").value
);

if(!Number.isFinite(value)||value<0){

alert(
"0원 이상의 금액을 입력해줘."
);

return;

}

accounts[current].money=
Math.floor(value);

document.getElementById(
"newBalance"
).value="";

saveData();
update();

alert("💰 잔액을 바꿨어!");

}


function randomAccount(){

let number;

do{

let n="";

for(let i=0;i<12;i++){
n+=Math.floor(Math.random()*10);
}

number=
n.slice(0,3)+"-"+
n.slice(3,6)+"-"+
n.slice(6);

}while(
accounts.some(
a=>a.number===number
)
);

return number;

}


function randomBank(){

const banks=[
"대한은행",
"두리은행",
"수난은행"
];

return banks[
Math.floor(
Math.random()*banks.length
)
];

}


function addAccount(){

const owner=
document.getElementById("newOwner")
.value.trim();

let bank=
document.getElementById("newBank")
.value.trim();

let number=
document.getElementById("newAccount")
.value.trim();

const money=
Number(
document.getElementById("newMoney")
.value
);

const password=
document.getElementById("newPassword")
.value;

const logo=
document.getElementById("newLogo")
.value.trim();


if(!owner){

alert(
"계좌 주인 이름을 입력해줘."
);

return;

}


if(!bank){
bank=randomBank();
}


if(!number){
number=randomAccount();
}


if(accounts.some(
a=>a.bank===bank &&
a.number===number
)){

alert(
"이미 있는 은행+계좌번호야."
);

return;

}


if(!Number.isFinite(money)||money<0){

alert(
"올바른 잔액을 입력해줘."
);

return;

}


if(!password){

alert(
"계좌 비밀번호를 입력해줘."
);

return;

}


/*
같은 은행 이름이면
기존 마크를 유지
*/

if(!bankLogos[bank]){

if(logo){
bankLogos[bank]=logo;
}else{
getBankLogo(bank);
}

}


accounts.push({

owner,
bank,
number,
password,
money:Math.floor(money),
history:[]

});


current=accounts.length-1;


[
"newOwner",
"newBank",
"newAccount",
"newMoney",
"newPassword",
"newLogo"
].forEach(id=>{
document.getElementById(id).value="";
});


saveData();
update();


alert(
"✨ "+owner+
"님의 계좌를 만들었어!\n\n"+
getBankLogo(bank)+" "+bank+
"\n"+number
);

}


function selectAccount(index){

current=index;

saveData();
update();

}


function deleteAccount(index){

const target=accounts[index];

if(!confirm(
"🗑️ "+target.owner+
"님의 계좌를 삭제할까?"
)){

return;

}


accounts.splice(index,1);


if(accounts.length===0){

accounts=[
{
owner:"강리노",
bank:"대한은행",
number:"482-731-905164",
password:"1234",
money:100000,
history:[]
}
];

}


if(current>=accounts.length){
current=accounts.length-1;
}


saveData();
update();

alert(
"🗑️ 계좌를 삭제했어."
);

}


function resetAllData(){

const first=confirm(
`⚠️ 정말 전체 초기화할까?

모든 가상 계좌
잔액
송금 내역
