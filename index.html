
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상은행</title>
<style>
:root {
  --bg:#f5f7fb;
  --card:#fff;
  --text:#202638;
  --sub:#7b8498;
  --blue:#4778f5;
  --line:#e8ecf4;
  --green:#16a778;
  --red:#e85b6b;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,select {font:inherit}
button {cursor:pointer;border:0}
button:disabled {opacity:.45;cursor:not-allowed}
.app {max-width:560px;margin:auto;padding:18px 15px 40px}
header {display:flex;align-items:center;justify-content:space-between;margin:4px 0 23px}
.logo {font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span {color:var(--blue)}
.small-btn {background:#edf1fa;color:#52617c;border-radius:12px;padding:9px 12px;font-size:13px}
h1 {font-size:25px;letter-spacing:-1px;margin:0 0 7px}
h2 {font-size:20px;margin:0 0 15px;letter-spacing:-.5px}
h3 {font-size:15px;margin:0 0 10px}
.muted {color:var(--sub);font-size:13px}
.card {background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:14px;box-shadow:0 5px 20px #24345c06}
.person-nav {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}
.nav-btn {width:40px;height:40px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:20px;color:#4c5b76}
.person-name {font-size:18px;font-weight:800;text-align:center;flex:1}
.bank-card {color:white;border-radius:25px;padding:22px;background:linear-gradient(135deg,#507ff7,#6a65e8);position:relative;overflow:hidden;min-height:205px;box-shadow:0 13px 28px #5279e92c}
.bank-card:before,.bank-card:after {content:"";position:absolute;border-radius:50%;background:#ffffff12}
.bank-card:before {width:190px;height:190px;right:-55px;top:-65px}
.bank-card:after {width:130px;height:130px;right:65px;bottom:-100px}
.bank-card>* {position:relative;z-index:1}
.bank-top {display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank-name {font-size:15px;font-weight:800}
.bank-mark {display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:6px;vertical-align:-2px;box-shadow:inset -3px -3px 5px #0002,inset 2px 2px 4px #fff8}
.account-label {font-size:12px;opacity:.8;margin-top:23px}
.account-number {font-size:17px;font-weight:750;letter-spacing:1px;overflow-wrap:anywhere;margin-top:5px}
.balance-label {font-size:12px;opacity:.85;margin-top:20px}
.balance-line {display:flex;align-items:center;gap:9px;margin-top:4px}
.balance {font-size:29px;font-weight:900;letter-spacing:-1px;overflow-wrap:anywhere}
.eye-btn {background:#ffffff22;color:white;border-radius:10px;padding:6px 9px}
.account-switch {display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.pill {font-size:12px;border-radius:999px;background:#eef3ff;color:#4778f5;padding:6px 10px;font-weight:700}
.actions {display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.action-btn {background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px 4px;color:#35415a;font-size:12px;font-weight:750}
.action-btn .ico {display:block;font-size:22px;margin-bottom:7px}
.section-title {display:flex;align-items:center;justify-content:space-between;gap:8px}
.row {display:flex;gap:9px;align-items:center}
.row>* {min-width:0}
.field {margin:12px 0}
label {display:block;font-size:13px;font-weight:750;margin-bottom:7px}
input,select {width:100%;padding:13px 12px;border:1px solid #dfe5ef;border-radius:13px;background:#fff;color:var(--text);outline:none;min-width:0}
input:focus,select:focus {border-color:var(--blue);box-shadow:0 0 0 3px #4778f518}
.primary {background:var(--blue);color:#fff;border-radius:14px;padding:14px 16px;font-weight:800;width:100%}
.secondary {background:#edf1fa;color:#45536c;border-radius:13px;padding:12px 14px;font-weight:700}
.danger {background:#fff0f1;color:#d8495a;border-radius:13px;padding:12px 14px;font-weight:750}
.full {width:100%}
.history-item {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.history-item:last-child {border-bottom:0}
.history-title {font-weight:750;font-size:14px;overflow-wrap:anywhere}
.history-date {font-size:11px;color:var(--sub);margin-top:4px}
.amount {font-weight:850;white-space:nowrap}
.amount.in {color:var(--blue)}
.amount.out {color:var(--red)}
.empty {text-align:center;padding:28px 10px;color:var(--sub);font-size:13px}
.hidden {display:none!important}
.notice {font-size:12px;color:var(--sub);line-height:1.65;margin-top:10px}
hr {border:0;border-top:1px solid var(--line);margin:18px 0}
.modal-backdrop {position:fixed;inset:0;z-index:1000;background:#121a2d88;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal-backdrop.hidden {display:none!important}
.modal {position:relative;background:#fff;width:min(100%,450px);max-height:90dvh;overflow-y:auto;border-radius:24px;padding:25px 20px 21px;box-shadow:0 25px 80px #0003;animation:pop .2s ease}
.close-btn {position:absolute;top:12px;right:12px;z-index:20;width:39px;height:39px;border-radius:13px;background:#f0f2f7;color:#38435a;font-size:22px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:manipulation}
.modal-body {padding-top:30px}
.modal h2 {padding-right:35px}
.modal .primary {margin-top:7px}
@keyframes pop {from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.big-emoji {font-size:46px;text-align:center;margin:8px 0 14px}
.center {text-align:center}
.recipient {background:#f3f6ff;padding:17px;border-radius:18px;text-align:center;margin:14px 0}
.recipient strong {display:block;font-size:18px;margin:6px 0}
.money-input {font-size:25px;font-weight:850;text-align:right}
.stat-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat {padding:14px;background:#f4f6fb;border-radius:15px}
.stat strong {display:block;font-size:19px;margin-top:5px;overflow-wrap:anywhere}
footer {text-align:center;color:#9ba3b4;font-size:11px;margin-top:22px;line-height:1.6}
@media(max-width:370px) {
  .app {padding:12px 10px 30px}
  .balance {font-size:25px}
  .account-number {font-size:15px}
  .actions {gap:6px}
  .action-btn {font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">구름<span> BANK</span></div>
    <button class="small-btn" data-action="lookup">계좌 조회</button>
  </header>

  <h1>내 계좌</h1>
  <div class="muted">내 돈을 한눈에 확인해 봐.</div>

  <div class="person-nav">
    <button class="nav-btn" data-action="prev-person" aria-label="이전 사람">‹</button>
    <div class="person-name" id="personName">강리노</div>
    <button class="nav-btn" data-action="next-person" aria-label="다음 사람">›</button>
  </div>

  <section class="bank-card">
    <div class="bank-top">
      <div class="bank-name" id="bankName"></div>
      <div style="font-size:12px;opacity:.85">VIRTUAL BANK</div>
    </div>
    <div class="account-label">계좌번호</div>
    <div class="account-number" id="accountNumber"></div>
    <div class="balance-label">사용 가능 잔액</div>
    <div class="balance-line">
      <div class="balance" id="balance">100,000원</div>
      <button class="eye-btn" data-action="toggle-balance" aria-label="잔액 숨기기">◉</button>
    </div>
  </section>

  <div class="account-switch">
    <button class="secondary" data-action="prev-account">‹ 이전 계좌</button>
    <span class="pill" id="accountCount">1개 계좌</span>
    <button class="secondary" data-action="next-account">다음 계좌 ›</button>
  </div>

  <div class="actions">
    <button class="action-btn" data-action="transfer"><span class="ico">↗</span>송금하기</button>
    <button class="action-btn" data-action="account-info"><span class="ico">▤</span>계좌정보</button>
    <button class="action-btn" data-action="copy-number"><span class="ico">▣</span>번호 복사</button>
    <button class="action-btn" data-action="change-password"><span class="ico">🔒</span>비밀번호 변경</button>
    <button class="action-btn" data-action="lookup"><span class="ico">⌕</span>계좌 조회</button>
    <button class="action-btn" data-action="statement"><span class="ico">▤</span>거래 명세</button>
  </div>

  <section class="card">
    <div class="section-title">
      <h2 style="margin:0">거래 내역</h2>
      <span class="muted" id="historyCount">최근 내역</span>
    </div>
    <div class="field">
      <input id="historySearch" placeholder="거래 상대방 또는 내용 검색">
    </div>
    <div class="row">
      <select id="historyFilter" aria-label="거래 유형">
        <option value="all">전체 거래</option>
        <option value="in">입금</option>
        <option value="out">출금</option>
      </select>
      <button class="secondary" data-action="refresh-history">조회</button>
    </div>
    <div id="historyList"></div>
  </section>

  <section class="card">
    <div class="section-title">
      <h2 style="margin:0">관리자</h2>
      <button class="small-btn" data-action="admin-login">⚙ 로그인</button>
    </div>
    <div class="muted" style="margin-top:8px">계좌 생성, 잔액 변경 및 데이터 관리</div>
  </section>

  <footer>
    가상은행 시뮬레이터 · 실제 금융기관이 아니야.<br>
    데이터는 이 브라우저에만 저장돼.
  </footer>
</div>

<div id="backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-label="가상은행 창">
    <button type="button" class="close-btn" data-close-modal aria-label="닫기">×</button>
    <div id="modalContent" class="modal-body"></div>
  </div>
</div>

<script>
"use strict";

const STORAGE_KEY = "virtual_bank_complete_v3";
const ADMIN_PASSWORD = "5555000";
const DEFAULT_BANKS = ["대한은행","두리은행","수난은행"];
const BANK_COLORS = ["#4778f5","#ed6c89","#22b891","#f2a63b","#8564df","#20a7bd","#e27a42"];

let state;
let personIndex = 0;
let accountIndex = 0;
let balanceHidden = false;
let adminUnlocked = false;
let transferDraft = {};
let transferStage = 0;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function digits(value) {
  return String(value || "").replace(/\D/g,"");
}
function normalizeNumber(value) {
  return digits(value);
}
function formatNumber(value) {
  let s = String(value || "").trim();
  if (!s) return "";
  if (s.includes("-")) {
    return s.split("-").map(digits).filter(Boolean).join("-");
  }
  const d = digits(s);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0,3)+"-"+d.slice(3);
  return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
}
function money(value) {
  return Math.floor(Number(value)||0).toLocaleString("ko-KR")+"원";
}
function bankColor(bank) {
  let hash = 0;
  for (const c of String(bank)) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  return BANK_COLORS[hash % BANK_COLORS.length];
}
function defaultState() {
  const first = {
    id: uid(),
    owner: "강리노",
    bank: "대한은행",
    number: "482-731-905164",
    password: "1234",
    balance: 100000,
    history: []
  };
  return {people:[{id:uid(),name:"강리노",accounts:[first]}]};
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    alert("저장에 실패했어. 브라우저 저장 공간을 확인해 줘.");
  }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.people)) return defaultState();
    parsed.people.forEach(p => {
      if (!Array.isArray(p.accounts)) p.accounts = [];
      p.accounts.forEach(a => {
        if (!Array.isArray(a.history)) a.history = [];
        if (typeof a.balance !== "number") a.balance = Number(a.balance)||0;
        a.number = formatNumber(a.number);
      });
    });
    return parsed.people.length ? parsed : defaultState();
  } catch(e) {
    return defaultState();
  }
}
state = load();

function allAccounts() {
  return state.people.flatMap(p => p.accounts.map(a => ({person:p,account:a})));
}
function currentPerson() {
  if (!state.people.length) return null;
  personIndex = Math.max(0, Math.min(personIndex,state.people.length-1));
  return state.people[personIndex];
}
function currentAccount() {
  const p = currentPerson();
  if (!p || !p.accounts.length) return null;
  accountIndex = Math.max(0,Math.min(accountIndex,p.accounts.length-1));
  return p.accounts[accountIndex];
}
function setPersonIndex(index) {
  if (!state.people.length) return;
  personIndex = (index + state.people.length) % state.people.length;
  accountIndex = 0;
  render();
}
function setAccountIndex(index) {
  const p = currentPerson();
  if (!p || !p.accounts.length) return;
  accountIndex = (index + p.accounts.length) % p.accounts.length;
  render();
}
function render() {
  const p = currentPerson();
  const a = currentAccount();
  document.getElementById("personName").textContent = p ? p.name : "계좌 없음";
  document.getElementById("accountCount").textContent = p ? `${p.accounts.length}개 계좌` : "0개 계좌";

  if (!a) {
    document.getElementById("bankName").textContent = "등록된 계좌 없음";
    document.getElementById("accountNumber").textContent = "-";
    document.getElementById("balance").textContent = "0원";
    renderHistory();
    return;
  }
  document.getElementById("bankName").innerHTML =
    `<span class="bank-mark" style="background:${bankColor(a.bank)}"></span>${escapeHTML(a.bank)}`;
  document.getElementById("accountNumber").textContent = a.number;
  document.getElementById("balance").textContent = balanceHidden ? "••••••원" : money(a.balance);
  document.querySelector('[data-action="toggle-balance"]').textContent = balanceHidden ? "◎" : "◉";
  renderHistory();
}
function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function addHistory(account, item) {
  account.history.unshift({
    id:uid(), time:new Date().toISOString(), ...item
  });
  account.history = account.history.slice(0,500);
}
function renderHistory() {
  const a = currentAccount();
  const list = document.getElementById("historyList");
  if (!a) { list.innerHTML = '<div class="empty">계좌가 없어.</div>'; return; }
  const search = document.getElementById("historySearch").value.trim().toLowerCase();
  const filter = document.getElementById("historyFilter").value;
  const items = a.history.filter(h => {
    if (filter !== "all" && h.type !== filter) return false;
    return !search || `${h.title} ${h.memo||""} ${h.bank||""}`.toLowerCase().includes(search);
  });
  document.getElementById("historyCount").textContent = `${items.length}건`;
  if (!items.length) {
    list.innerHTML = '<div class="empty">아직 거래 내역이 없어.</div>';
    return;
  }
  list.innerHTML = items.map(h => {
    const date = new Date(h.time);
    const time = isNaN(date) ? "" : date.toLocaleString("ko-KR");
    const incoming = h.type === "in";
    return `<div class="history-item">
      <div><div class="history-title">${escapeHTML(h.title||"거래")}</div>
      <div class="history-date">${escapeHTML(time)}${h.memo ? " · "+escapeHTML(h.memo) : ""}</div></div>
      <div class="amount ${incoming?"in":"out"}">${incoming?"+":"−"}${money(h.amount)}</div>
    </div>`;
  }).join("");
}

function openModal(html) {
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("backdrop").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  document.getElementById("backdrop").classList.add("hidden");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";
  transferDraft = {};
  transferStage = 0;
}
function modalTitle(title, subtitle="") {
  return `<h2>${escapeHTML(title)}</h2>${subtitle ? `<p class="muted">${escapeHTML(subtitle)}</p>` : ""}`;
}
function field(label, id, placeholder="", type="text", value="") {
  return `<div class="field"><label for="${id}">${escapeHTML(label)}</label>
  <input id="${id}" type="${type}" placeholder="${escapeHTML(placeholder)}" value="${escapeHTML(value)}" autocomplete="off"></div>`;
}
function selectOptions(items, selected="") {
  return items.map(item => `<option value="${escapeHTML(item.value)}" ${String(item.value)===String(selected)?"selected":""}>${escapeHTML(item.label)}</option>`).join("");
}
function lookupAccount(number) {
  const n = normalizeNumber(number);
  if (!n) return null;
  return allAccounts().find(x => normalizeNumber(x.account.number) === n) || null;
}
function showInfo(title, content) {
  openModal(`${modalTitle(title)}${content}<button class="primary" data-close-modal>확인</button>`);
}
function accountInfo() {
  const a = currentAccount(), p = currentPerson();
  if (!a) return alert("계좌가 없어.");
  showInfo("계좌 정보", `<div class="recipient"><strong>${escapeHTML(a.owner)}님의 계좌</strong>
    ${escapeHTML(a.bank)}<br><b>${escapeHTML(a.number)}</b></div>
    <div class="field"><label>예금주</label><input readonly value="${escapeHTML(p.name)}"></div>
    <div class="field"><label>잔액</label><input readonly value="${money(a.balance)}"></div>`);
}
function copyNumber() {
  const a = currentAccount();
  if (!a) return alert("계좌가 없어.");
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(a.number);
      alert("계좌번호를 복사했어!");
    } catch(e) {
      const input = document.createElement("textarea");
      input.value = a.number;
      document.body.appendChild(input);
      input.select();
      const ok = document.execCommand("copy");
      input.remove();
      alert(ok ? "계좌번호를 복사했어!" : "복사에 실패했어. 계좌번호를 길게 눌러 복사해 줘.");
    }
  };
  copy();
}
function startTransfer() {
  const a = currentAccount();
  if (!a) return alert("계좌가 없어.");
  transferDraft = {sender:a.id};
  openModal(`${modalTitle("누구에게 보낼까?","받는 사람의 계좌번호를 입력해 줘.")}
    <div class="field"><label>받는 은행</label>
    <input id="receiverBank" placeholder="은행 이름 (선택)" value=""></div>
    ${field("받는 계좌번호","receiverNumber","숫자만 입력해도 돼")}
    <button class="primary" data-action="find-recipient">받는 사람 확인</button>`);
}
function findRecipient() {
  const number = document.getElementById("receiverNumber").value;
  const found = lookupAccount(number);
  if (!found) return alert("해당 계좌를 찾을 수 없어. 계좌번호를 확인해 줘.");
  const sender = currentAccount();
  if (sender && found.account.id === sender.id) return alert("내 계좌로는 송금할 수 없어.");
  const bankInput = document.getElementById("receiverBank").value.trim();
  if (bankInput && bankInput !== found.account.bank) {
    return alert("은행 이름이 계좌 정보와 달라. 다시 확인해 줘.");
  }
  transferDraft.receiver = found.account.id;
  transferDraft.receiverPerson = found.person.name;
  transferStage = 1;
  showRecipientAmount();
}
function showRecipientAmount() {
  const found = allAccounts().find(x => x.account.id === transferDraft.receiver);
  if (!found) return alert("받는 계좌가 없어.");
  openModal(`<div class="big-emoji">💸</div>
    <div class="center"><h2>${escapeHTML(found.person.name)}님에게<br>얼마를 송금할까요?</h2>
    <div class="muted">${escapeHTML(found.account.bank)} · ${escapeHTML(found.account.number)}</div></div>
    <div class="field"><label>송금 금액</label><input id="transferAmount" class="money-input" type="number" min="1" step="1" placeholder="0원" inputmode="numeric"></div>
    <div class="muted">내 잔액 ${money(currentAccount()?.balance||0)}</div>
    ${field("내 계좌 비밀번호","transferPassword","비밀번호 4자리 이상","password")}
    <button class="primary" data-action="review-transfer">다음</button>`);
}
function reviewTransfer() {
  const sender = currentAccount();
  const recipient = allAccounts().find(x => x.account.id === transferDraft.receiver);
  if (!sender || !recipient) return alert("계좌 정보를 다시 확인해 줘.");
  const amount = Number(document.getElementById("transferAmount").value);
  const password = document.getElementById("transferPassword").value;
  if (!Number.isSafeInteger(amount) || amount <= 0) return alert("송금 금액은 1원 이상의 정수로 입력해 줘.");
  if (amount > sender.balance) return alert("잔액이 부족해.");
  if (password !== sender.password) return alert("계좌 비밀번호가 틀렸어.");
  if (sender.id === recipient.account.id) return alert("내 계좌로는 송금할 수 없어.");
  transferDraft.amount = amount;
  transferDraft.password = password;
  transferStage = 2;
  openModal(`<div class="big-emoji">🧾</div>${modalTitle("송금 내용을 확인해 줘")}
    <div class="recipient"><div class="muted">받는 사람</div><strong>${escapeHTML(recipient.person.name)}님</strong>
    ${escapeHTML(recipient.account.bank)}<br>${escapeHTML(recipient.account.number)}</div>
    <div class="history-item"><span>보낼 금액</span><b>${money(amount)}</b></div>
    <div class="history-item"><span>수수료</span><b>0원</b></div>
    <div class="history-item"><span>송금 후 잔액</span><b>${money(sender.balance-amount)}</b></div>
    <p class="notice">확인 버튼을 누르면 가상 거래가 처리돼.</p>
    <button class="primary" data-action="confirm-transfer">이대로 송금하기</button>
    <button class="secondary full" style="margin-top:9px" data-action="back-transfer">이전</button>`);
}
function confirmTransfer() {
  const sender = currentAccount();
  const receiverEntry = allAccounts().find(x => x.account.id === transferDraft.receiver);
  if (!sender || !receiverEntry) return alert("계좌 정보를 찾을 수 없어.");
  const receiver = receiverEntry.account;
  const amount = transferDraft.amount;
  if (sender.password !== transferDraft.password) return alert("비밀번호가 변경됐어. 다시 시도해 줘.");
  if (!Number.isSafeInteger(amount) || amount <= 0 || sender.balance < amount) return alert("잔액 또는 송금 금액을 확인해 줘.");
  sender.balance -= amount;
  receiver.balance += amount;
  addHistory(sender,{type:"out",title:receiverEntry.person.name+"님에게 송금",amount,bank:receiver.bank});
  addHistory(receiver,{type:"in",title:sender.owner+"님에게 입금",amount,bank:sender.bank});
  save();
  render();
  transferStage = 3;
  openModal(`<div class="big-emoji" style="animation:pop .4s">🎉</div>
    <div class="center"><h2>송금 완료!</h2><div style="font-size:29px;font-weight:900;color:var(--blue);margin:15px 0">${money(amount)}</div>
    <p class="muted">${escapeHTML(receiverEntry.person.name)}님에게 안전하게 보냈어.</p></div>
    <button class="primary" data-action="finish-transfer">확인</button>`);
}
function backTransfer() { showRecipientAmount(); }

function lookupModal() {
  openModal(`${modalTitle("계좌 조회","은행 이름과 계좌번호를 입력해 줘.")}
    ${field("은행 이름 (선택)","lookupBank","예: 대한은행")}
    ${field("계좌번호","lookupNumber","하이픈 없이 입력해도 돼")}
    <button class="primary" data-action="do-lookup">조회하기</button><div id="lookupResult"></div>`);
}
function doLookup() {
  const n = document.getElementById("lookupNumber").value;
  const bank = document.getElementById("lookupBank").value.trim();
  const found = lookupAccount(n);
  const result = document.getElementById("lookupResult");
  if (!found || (bank && bank !== found.account.bank)) {
    result.innerHTML = '<div class="empty">일치하는 계좌가 없어.</div>';
    return;
  }
  result.innerHTML = `<div class="recipient"><div class="muted">조회 결과</div><strong>${escapeHTML(found.person.name)}님</strong>${escapeHTML(found.account.bank)}<br>${escapeHTML(found.account.number)}</div>`;
}
function changePassword() {
  const a = currentAccount();
  if (!a) return alert("계좌가 없어.");
  openModal(`${modalTitle("비밀번호 변경")}
    ${field("현재 비밀번호","oldPassword","현재 비밀번호","password")}
    ${field("새 비밀번호","newPassword","새 비밀번호","password")}
    ${field("새 비밀번호 확인","confirmPassword","한 번 더 입력","password")}
    <button class="primary" data-action="save-password">변경하기</button>`);
}
function savePassword() {
  const a = currentAccount();
  if (!a) return;
  const old = document.getElementById("oldPassword").value;
  const next = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  if (old !== a.password) return alert("현재 비밀번호가 틀렸어.");
  if (next.length < 4) return alert("새 비밀번호는 4자리 이상으로 입력해 줘.");
  if (next !== confirm) return alert("새 비밀번호가 서로 달라.");
  a.password = next;
  save();
  alert("비밀번호를 변경했어.");
  closeModal();
}
function statement() {
  const a = currentAccount();
  if (!a) return alert("계좌가 없어.");
  const rows = [["일시","구분","내용","금액"]];
  a.history.slice().reverse().forEach(h => rows.push([
    new Date(h.time).toLocaleString("ko-KR"),
    h.type === "in" ? "입금" : "출금",
    h.title,
    (h.type === "in" ? "+" : "-") + h.amount
  ]));
  const csv = "\uFEFF"+rows.map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "가상은행_거래명세.csv";
  link.click();
  URL.revokeObjectURL(url);
}
function adminLogin() {
  openModal(`${modalTitle("관리자 로그인","관리자 비밀번호를 입력해 줘.")}
    ${field("관리자 비밀번호","adminPassword","비밀번호","password")}
    <button class="primary" data-action="verify-admin">로그인</button>`);
}
function verifyAdmin() {
  if (document.getElementById("adminPassword").value !== ADMIN_PASSWORD) return alert("관리자 비밀번호가 틀렸어.");
  adminUnlocked = true;
  adminPanel();
}
function adminPanel() {
  if (!adminUnlocked) return adminLogin();
  const peopleOptions = state.people.map(p => ({value:p.id,label:p.name}));
  const p = currentPerson();
  const accountOptions = allAccounts().map(x => ({value:x.account.id,label:`${x.person.name} · ${x.account.bank} · ${x.account.number}`}));
  const totalAccounts = allAccounts().length;
  const totalBalance = allAccounts().reduce((sum,x)=>sum+x.account.balance,0);
  openModal(`${modalTitle("관리자 패널","가상 계좌 관리")}
    <div class="stat-grid">
      <div class="stat"><span class="muted">등록 인원</span><strong>${state.people.length}명</strong></div>
      <div class="stat"><span class="muted">전체 계좌</span><strong>${totalAccounts}개</strong></div>
      <div class="stat" style="grid-column:1/-1"><span class="muted">전체 가상 잔액</span><strong>${money(totalBalance)}</strong></div>
    </div>
    <hr>
    <h3>새 계좌 만들기</h3>
    <div class="field"><label>만들 대상</label><select id="createTarget">
      <option value="selected">현재 선택한 사람 (${escapeHTML(p?.name||"없음")})</option>
      <option value="new">새 사람 만들기</option>
    </select></div>
    ${field("새 사람 이름 (새 사람을 만들 때)","newPersonName","이름")}
    ${field("예금주 이름 (선택)","newOwner","비워두면 대상 이름 사용")}
    ${field("은행 이름 (선택)","newBank","비우면 은행 무작위")}
    ${field("계좌번호 (선택)","newNumber","비우면 자동 생성")}
    ${field("초기 잔액","newBalance","100000","number","100000")}
    ${field("계좌 비밀번호","newAccountPassword","4자리 이상","password","1234")}
    <button class="primary" data-action="create-account">계좌 생성</button>
    <hr>
    <h3>계좌 관리</h3>
    <div class="field"><label>관리할 계좌</label><select id="manageAccount">${selectOptions(accountOptions, currentAccount()?.id||"")}</select></div>
    ${field("잔액 변경량 (+입금 / -출금)","balanceDelta","예: 50000 또는 -1000","number")}
    <button class="secondary full" data-action="adjust-balance">잔액 적용</button>
    ${field("새 비밀번호","adminNewPassword","새 비밀번호","password")}
    <button class="secondary full" data-action="admin-password">비밀번호 변경</button>
    <button class="danger full" style="margin-top:10px" data-action="delete-account">선택 계좌 삭제</button>
    <hr>
    <h3>데이터 관리</h3>
    <button class="secondary full" data-action="export-backup">백업 파일 저장</button>
    <div class="field"><label>백업 파일 복원</label><input type="file" id="restoreFile" accept=".json,application/json"></div>
    <button class="secondary full" data-action="import-backup">백업 복원</button>
    <button class="danger full" style="margin-top:10px" data-action="reset-data">전체 초기화</button>
    <p class="notice">이 시뮬레이터는 브라우저 로컬 저장소를 사용해. 다른 기기와 자동으로 동기화되지 않아.</p>`);
}
function createAccount() {
  const target = document.getElementById("createTarget").value;
  const newName = document.getElementById("newPersonName").value.trim();
  const owner = document.getElementById("newOwner").value.trim();
  let person;
  if (target === "new") {
    if (!newName) return alert("새 사람 이름을 입력해 줘.");
    person = state.people.find(p=>p.name===newName);
    if (!person) {
      person = {id:uid(),name:newName,accounts:[]};
      state.people.push(person);
    }
  } else {
    person = currentPerson();
    if (!person) return alert("대상 사람이 없어.");
  }
  let bank = document.getElementById("newBank").value.trim();
  if (!bank) bank = DEFAULT_BANKS[Math.floor(Math.random()*DEFAULT_BANKS.length)];
  let number = document.getElementById("newNumber").value.trim();
  if (!number) number = `${Math.floor(100+Math.random()*900)}-${Math.floor(100+Math.random()*900)}-${Math.floor(100000+Math.random()*900000)}`;
  number = formatNumber(number);
  if (normalizeNumber(number).length < 4) return alert("계좌번호를 4자리 이상 입력해 줘.");
  if (lookupAccount(number)) return alert("이미 등록된 계좌번호야.");
  const balance = Number(document.getElementById("newBalance").value);
  const password = document.getElementById("newAccountPassword").value;
  if (!Number.isSafeInteger(balance) || balance < 0) return alert("초기 잔액은 0 이상의 정수로 입력해 줘.");
  if (password.length < 4) return alert("계좌 비밀번호는 4자리 이상이어야 해.");
  person.accounts.push({
    id:uid(),owner:owner||person.name,bank,number,password,balance,history:[]
  });
  personIndex = state.people.findIndex(p=>p.id===person.id);
  accountIndex = person.accounts.length-1;
  save(); render(); adminPanel();
  alert("계좌를 만들었어!");
}
function selectedAdminAccount() {
  const id = document.getElementById("manageAccount")?.value;
  return allAccounts().find(x=>x.account.id===id)||null;
}
function adjustBalance() {
  const entry = selectedAdminAccount();
  if (!entry) return alert("관리할 계좌를 선택해 줘.");
  const delta = Number(document.getElementById("balanceDelta").value);
  if (!Number.isSafeInteger(delta) || delta===0) return alert("0이 아닌 정수로 입력해 줘.");
  if (entry.account.balance+delta<0) return alert("잔액이 0원 미만이 될 수 없어.");
  entry.account.balance += delta;
  addHistory(entry.account,{type:delta>0?"in":"out",title:"관리자 잔액 조정",amount:Math.abs(delta),memo:"관리자"});
  save(); render(); adminPanel();
}
function adminChangePassword() {
  const entry = selectedAdminAccount();
  const password = document.getElementById("adminNewPassword").value;
  if (!entry) return alert("관리할 계좌를 선택해 줘.");
  if (password.length<4) return alert("비밀번호는 4자리 이상이어야 해.");
  entry.account.password = password;
  save();
  alert("계좌 비밀번호를 변경했어.");
  adminPanel();
}
function deleteAccount() {
  const entry = selectedAdminAccount();
  if (!entry) return alert("삭제할 계좌를 선택해 줘.");
  if (!confirm(`${entry.person.name}님의 ${entry.account.number} 계좌를 삭제할까?`)) return;
  if (!confirm("삭제한 계좌와 거래 내역은 복구할 수 없어. 정말 삭제할까?")) return;
  entry.person.accounts = entry.person.accounts.filter(a=>a.id!==entry.account.id);
  if (!entry.person.accounts.length) {
    if (state.people.length>1) {
      state.people = state.people.filter(p=>p.id!==entry.person.id);
      personIndex = 0;
    } else {
      entry.person.name = "새 사용자";
    }
  }
  personIndex = Math.min(personIndex,state.people.length-1);
  accountIndex = 0;
  save(); render(); adminPanel();
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;a.download="가상은행_백업.json";a.click();
  URL.revokeObjectURL(url);
}
function importBackup() {
  const file = document.getElementById("restoreFile").files[0];
  if (!file) return alert("백업 JSON 파일을 선택해 줘.");
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!incoming || !Array.isArray(incoming.people) ||
          !incoming.people.every(p=>p && typeof p.name==="string" && Array.isArray(p.accounts))) {
        throw new Error("잘못된 파일");
      }
      if (!confirm("현재 가상은행 데이터를 백업 파일로 바꿀까?")) return;
      incoming.people.forEach(p=>p.accounts.forEach(a=>{
        a.number = formatNumber(a.number);
        if (!Array.isArray(a.history)) a.history=[];
        a.balance = Number(a.balance)||0;
      }));
      state = incoming;
      personIndex=0;accountIndex=0;
      save();render();adminPanel();
      alert("백업을 복원했어.");
    } catch(e) {
      alert("올바른 가상은행 백업 파일이 아니야.");
    }
  };
  reader.readAsText(file);
}
function resetData() {
  if (!confirm("모든 사람, 계좌, 잔액, 거래 내역을 초기화할까?")) return;
  if (!confirm("마지막 확인이야. 기존 데이터는 복구할 수 없어. 정말 초기화할까?")) return;
  state = defaultState();
  personIndex=0;accountIndex=0;balanceHidden=false;
  save();render();closeModal();
  alert("초기화 완료!");
}

document.addEventListener("click", function(event) {
  const close = event.target.closest("[data-close-modal]");
  if (close) {
    event.preventDefault();
    event.stopPropagation();
    closeModal();
    return;
  }
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  try {
    switch(action) {
      case "prev-person": setPersonIndex(personIndex-1); break;
      case "next-person": setPersonIndex(personIndex+1); break;
      case "prev-account": setAccountIndex(accountIndex-1); break;
      case "next-account": setAccountIndex(accountIndex+1); break;
      case "toggle-balance": balanceHidden=!balanceHidden; render(); break;
      case "transfer": startTransfer(); break;
      case "account-info": accountInfo(); break;
      case "copy-number": copyNumber(); break;
      case "change-password": changePassword(); break;
      case "lookup": lookupModal(); break;
      case "statement": statement(); break;
      case "refresh-history": renderHistory(); break;
      case "admin-login": adminLogin(); break;
      case "find-recipient": findRecipient(); break;
      case "review-transfer": reviewTransfer(); break;
      case "confirm-transfer": confirmTransfer(); break;
      case "back-transfer": backTransfer(); break;
      case "finish-transfer": closeModal(); break;
      case "do-lookup": doLookup(); break;
      case "save-password": savePassword(); break;
      case "verify-admin": verifyAdmin(); break;
      case "create-account": createAccount(); break;
      case "adjust-balance": adjustBalance(); break;
      case "admin-password": adminChangePassword(); break;
      case "delete-account": deleteAccount(); break;
      case "export-backup": exportBackup(); break;
      case "import-backup": importBackup(); break;
      case "reset-data": resetData(); break;
    }
  } catch(error) {
    console.error(error);
    alert("처리 중 오류가 발생했어. 입력 내용을 확인해 줘.");
  }
});

document.getElementById("backdrop").addEventListener("click",function(event) {
  if (event.target === this) closeModal();
});
document.addEventListener("keydown",function(event) {
  if (event.key === "Escape") closeModal();
});
document.getElementById("historySearch").addEventListener("input",renderHistory);
document.getElementById("historyFilter").addEventListener("change",renderHistory);

render();
</script>
</body>
</html>
