<!-- 관리자 버튼 -->
<button class="admin-btn" onclick="openAdmin()">관리자</button>

<div class="admin-panel" id="adminPanel">
  <div class="admin-box">
    <h2>🔐 관리자</h2>

    <div id="loginArea">
      <p>관리자 비밀번호</p>
      <input id="adminPw" type="password" placeholder="비밀번호">
      <button onclick="loginAdmin()">확인</button>
      <div id="pwError"></div>
    </div>

    <div id="controlArea" style="display:none;">
      <p>현재 잔액</p>
      <div id="adminBalance" class="admin-balance">100,000원</div>

      <p>잔액 설정</p>
      <input id="newBalance" type="number" placeholder="새 잔액">

      <button onclick="changeBalance()">잔액 변경</button>
      <button onclick="closeAdmin()">닫기</button>
    </div>
  </div>
</div>

<style>
.admin-btn{
  position:fixed;
  right:8px;
  bottom:8px;
  border:0;
  background:#ddd;
  color:#777;
  font-size:10px;
  padding:5px 8px;
  border-radius:8px;
  opacity:.65;
}

.admin-panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.admin-box{
  width:calc(100% - 40px);
  max-width:350px;
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.admin-box h2{
  margin-top:0;
}

.admin-box input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
  font-size:16px;
}

.admin-box button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:7px;
  background:#222;
  color:white;
  font-weight:bold;
}

.admin-balance{
  font-size:25px;
  font-weight:bold;
  margin:10px 0 18px;
}

#pwError{
  color:#e53935;
  font-size:13px;
  margin-top:8px;
}
</style>

<script>
let balance = 100000;

function updateBalance(){
  document.getElementById("balance").textContent =
    balance.toLocaleString("ko-KR") + "원";

  document.getElementById("adminBalance").textContent =
    balance.toLocaleString("ko-KR") + "원";
}

function openAdmin(){
  document.getElementById("adminPanel").style.display = "flex";
  document.getElementById("loginArea").style.display = "block";
  document.getElementById("controlArea").style.display = "none";
  document.getElementById("adminPw").value = "";
  document.getElementById("pwError").textContent = "";
}

function loginAdmin(){
  const pw = document.getElementById("adminPw").value;

  if(pw === "5555000"){
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("controlArea").style.display = "block";
    updateBalance();
  }else{
    document.getElementById("pwError").textContent =
      "비밀번호가 올바르지 않습니다.";
  }
}

function changeBalance(){
  const value = Number(document.getElementById("newBalance").value);

  if(!Number.isFinite(value) || value < 0){
    alert("올바른 금액을 입력해주세요.");
    return;
  }

  balance = Math.floor(value);
  updateBalance();

  document.getElementById("newBalance").value = "";
  alert("가상 잔액이 변경되었습니다.");
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display = "none";
}
</script>
