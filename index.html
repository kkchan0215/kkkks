<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 모음</title>

<style>
body{
    margin:0;
    background:#f7f4ea;
    font-family:"Malgun Gothic",sans-serif;
}

h1{
    text-align:center;
    margin:30px;
}

.grid{
    width:1100px;
    max-width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card h2{
    text-align:center;
    font-size:20px;
}

iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-bottom:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#3d9242;
}
</style>
</head>

<body>

<h1>🎬 영상 모음</h1>

<div class="grid">

<div class="card">
<h2>내 영상</h2>

<input id="link" placeholder="유튜브 링크 붙여넣기">

<button onclick="loadVideo()">영상 불러오기</button>

<iframe id="player"></iframe>

</div>

<div class="card">
<h2>펼쳐봐</h2>

<iframe
src="https://youtu.be/gPuVsMpMUjg?si=nS5tnmpgghSpLcFh"
allowfullscreen>
</iframe>

</div>

<div class="card">
<h2>홀리 탐험대</h2>

<iframe
src="https://youtu.be/b8nno8ZbsAE?si=O0mcKfsj7jEjwLT9"
allowfullscreen>
</iframe>

</div>

<div class="card">
<h2>하나님 부르심</h2>

<iframe
src="https://youtu.be/9pFKGv3E0wg?si=trbNj_fe1Z0bny23"
allowfullscreen>
</iframe>

</div>

<div class="card">
<h2>구약 목록</h2>

<iframe
src="https://youtu.be/TMaigU5zH9o?si=Abyz0I3SlqZyWfY4"
allowfullscreen>
</iframe>

</div>

</div>

<script>

function loadVideo(){

let url=document.getElementById("link").value;

let id="";

if(url.includes("watch?v=")){
id=url.split("watch?v=")[1].split("&")[0];
}
else if(url.includes("youtu.be/")){
id=url.split("youtu.be/")[1].split("?")[0];
}

if(id!=""){
document.getElementById("player").src="https://www.youtube.com/embed/"+id;
}
else{
alert("올바른 유튜브 링크를 입력하세요.");
}

}

</script>

</body>
</html>
