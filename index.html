
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상은행</title>
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--ink:#20243a;--muted:#858ba0;
  --blue:#526df5;--line:#e8eaf2;--green:#13a77b;--red:#ed6374;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
button:active{transform:scale(.98)}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:#fff;
  border-bottom:1px solid var(--line);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:950;color:var(--blue)}
.head-buttons{display:flex;gap:7px}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:850px;margin:auto;padding:18px 14px 45px}
.small-btn{background:#f0f2ff;color:var(--blue);padding:9px 11px;
  border-radius:11px;font-weight:800;font-size:13px}
.section-title{font-size:17px;font-weight:900;margin:22px 0 12px}
.person-bar{display:flex;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px;gap:10px}
.arrow{width:38px;height:38px;border-radius:12px;background:#f0f2ff;
  color:var(--blue);font-size:23px;font-weight:900}
.person-name{text-align:center;font-weight:900;flex:1}
.subtle{font-size:12px;color:var(--muted);margin-top:4px}
.bank-card{position:relative;overflow:hidden;color:white;border-radius:25px;
  padding:23px;background:linear-gradient(135deg,#536ff4,#818cf8 62%,#aaa5ff);
  box-shadow:0 12px 30px #526df526}
.bank-card:before,.bank-card:after{content:"";position:absolute;border-radius:50%;
  background:#ffffff13;pointer-events:none}
.bank-card:before{width:220px;height:220px;right:-70px;top:-115px}
.bank-card:after{width:150px;height:150px;right:90px;bottom:-125px}
.card-content{position:relative;z-index:1}
.bank-line{display:flex;align-items:center;gap:9px;font-weight:850}
.bank-ball{width:15px;height:15px;border:2px solid #ffffffaa;border-radius:50%;flex-shrink:0}
.card-owner{margin-top:20px;font-size:13px;color:#ffffffdf}
.account-number{font-size:clamp(17px,4.5vw,23px);font-weight:900;
  letter-spacing:1px;overflow-wrap:anywhere;margin-top:7px}
.balance-label{font-size:12px;color:#ffffffd8;margin-top:22px}
.balance-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.balance{font-size:clamp(28px,7vw,36px);font-weight:950;overflow-wrap:anywhere}
.eye-btn{background:#ffffff24;color:white;border-radius:10px;padding:7px 10px;font-size:13px}
.card-foot{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-top:12px;font-size:12px;color:#ffffffdf}
.account-switch{display:flex;gap:7px;margin-top:12px}
.account-switch button{flex:1;border-radius:12px;background:#fff;border:1px solid var(--line);
  color:var(--ink);padding:10px;font-weight:850}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.action{background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:14px 4px;font-size:12px;font-weight:850;color:var(--ink)}
.action span{display:block;font-size:23px;margin-bottom:6px}
.action.main-action{background:var(--blue);border-color:var(--blue);color:white}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:19px;font-weight:950;margin-top:6px;overflow-wrap:anywhere}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:850;margin-bottom:7px}
.field input,.field select,.field textarea,.search-input{
  width:100%;min-width:0;border:1px solid #dfe2ef;border-radius:12px;
  padding:12px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.search-input:focus{border-color:var(--blue)}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}
.btn{background:#eef0ff;color:var(--blue);border-radius:12px;
  padding:12px 14px;font-weight:850}
.btn.primary{background:var(--blue);color:white}
.btn.danger{background:#fff0f1;color:var(--red)}
.btn.dark{background:#30364b;color:white}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:9px}
.history-list{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.history-item{display:flex;align-items:center;gap:10px;padding:12px;
  border:1px solid var(--line);border-radius:14px}
.history-icon{width:39px;height:39px;border-radius:13px;background:#f0f2ff;
  display:grid;place-items:center;font-size:19px;flex-shrink:0}
.history-main{flex:1;min-width:0}
.history-title{font-weight:850;font-size:13px;overflow-wrap:anywhere}
.history-sub{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.history-amount{font-size:14px;font-weight:900;white-space:nowrap}
.income{color:var(--green)}.expense{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:23px 5px;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:#15182c80;z-index:20;
  display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:min(100%,470px);max-height:91vh;overflow-y:auto;background:#fff;
  border-radius:23px;padding:22px;box-shadow:0 20px 70px #15182c30}
.modal h2{font-size:21px;margin:0 0 18px}
.close-btn{float:right;background:#f0f1f7;border-radius:9px;padding:6px 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:50;background:#24283a;color:white;padding:12px 17px;
  border-radius:13px;font-size:13px;max-width:92%;text-align:center}
.lookup-result{background:#f4f5ff;border-radius:13px;padding:13px;
  font-size:13px;line-height:1.9;overflow-wrap:anywhere;margin-top:12px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-box{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.admin-box h3{font-size:15px;margin:0 0 13px}
.admin-box .field{margin-bottom:10px}
.admin-box .btn{margin-top:3px}
.divider{border:0;border-top:1px solid var(--line);margin:17px 0}
.transfer-stage{animation:slideIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{
  from{opacity:0;transform:translateY(22px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes popIn{
  0%{opacity:0;transform:scale(.75)}
  75%{transform:scale(1.06)}
  100%{opacity:1;transform:scale(1)}
}
.recipient-avatar{width:66px;height:66px;border-radius:23px;background:#edf0ff;
  color:var(--blue);display:grid;place-items:center;font-size:30px;font-weight:950;
  margin:0 auto 13px;animation:popIn .45s ease both}
.recipient-card{text-align:center;padding:15px 0 20px}
.recipient-title{font-size:22px;font-weight:950;line-height:1.45}
.recipient-bank{font-size:13px;color:var(--muted);margin-top:6px}
.amount-input{font-size:25px!important;font-weight:950;text-align:right}
.amount-preview{font-size:12px;color:var(--muted);text-align:right;margin-top:5px}
.confirm-summary{background:#f5f6fb;border-radius:15px;padding:15px;margin:14px 0}
.confirm-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.confirm-line strong{text-align:right;overflow-wrap:anywhere}
.success-circle{width:72px;height:72px;border-radius:50%;background:#e4f8f0;
  color:var(--green);display:grid;place-items:center;font-size:39px;
  margin:8px auto 15px;animation:popIn .4s ease both}
@media(max-width:560px){
  main{padding:14px 11px 35px}
  .bank-card{padding:20px}
  .actions{gap:7px}
  .action{padding:12px 3px}
  .admin-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="logo">● 가상은행</div>
  <div class="head-buttons">
    <button class="small-btn" onclick="openLookup()">계좌 조회</button>
    <button class="small-btn" onclick="openAdminLogin()" aria-label="관리자 로그인">⚙</button>
  </div>
</header>

<main id="home">
  <div class="section-title">계좌 주인</div>
  <div class="person-bar">
    <button class="arrow" onclick="movePerson(-1)">‹</button>
    <div class="person-name">
      <div id="personName">계좌 주인</div>
      <div class="subtle" id="personMeta"></div>
    </div>
    <button class="arrow" onclick="movePerson(1)">›</button>
  </div>

  <div class="section-title">내 계좌</div>
  <div class="bank-card">
    <div class="card-content">
      <div class="bank-line"><span class="bank-ball" id="bankBall"></span><span id="bankName"></span></div>
      <div class="card-owner" id="cardOwner"></div>
      <div class="account-number" id="accountNumber"></div>
      <div class="balance-label">사용 가능한 잔액</div>
      <div class="balance-row">
        <div class="balance" id="balance"></div>
        <button class="eye-btn" id="eyeButton" onclick="toggleBalance()">잔액 숨기기</button>
      </div>
      <div class="card-foot">
        <span>VIRTUAL BANK</span>
        <span id="accountPosition"></span>
      </div>
    </div>
  </div>
  <div class="account-switch">
    <button onclick="moveAccount(-1)">‹ 이전 계좌</button>
    <button onclick="moveAccount(1)">다음 계좌 ›</button>
  </div>

  <div class="actions">
    <button class="action main-action" onclick="openTransfer()"><span>↗</span>송금하기</button>
    <button class="action" onclick="openDetails()"><span>▤</span>계좌정보</button>
    <button class="action" onclick="copyAccountNumber()"><span>▣</span>번호 복사</button>
    <button class="action" onclick="openPasswordChange()"><span>🔒</span>비밀번호 변경</button>
    <button class="action" onclick="openLookup()"><span>⌕</span>계좌 조회</button>
    <button class="action" onclick="showStatement()"><span>📄</span>거래 명세</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">이 사람의 전체 잔액</div><div class="stat-value" id="totalBalance"></div></div>
    <div class="stat"><div class="stat-label">보유 계좌 수</div><div class="stat-value" id="totalAccounts"></div></div>
  </div>

  <div class="section-title">거래 내역</div>
  <div class="panel">
    <input class="search-input" id="historySearch" placeholder="거래 내역 검색" oninput="renderHistory()">
    <div class="history-head" style="margin-top:12px">
      <strong>최근 거래</strong>
      <select id="historyFilter" onchange="renderHistory()" style="padding:8px;border:1px solid var(--line);border-radius:10px">
        <option value="all">전체</option><option value="in">입금</option><option value="out">출금</option>
      </select>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div class="hint" style="text-align:center;margin-top:18px">
    연습용 가상은행 · 실제 금융 거래는 이루어지지 않아.
  </div>
</main>

<section id="adminPage" class="hidden">
  <main>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><div class="section-title" style="margin:4px 0">관리자 패널</div><div class="subtle">계좌 및 은행 관리</div></div>
      <button class="btn" onclick="closeAdmin()">나가기</button>
    </div>

    <div class="panel" style="margin-top:15px">
      <div class="field"><label>계좌 주인</label><select id="adminPerson" onchange="adminPersonChanged()"></select></div>
      <div class="field"><label>관리할 계좌</label><select id="adminAccount" onchange="adminAccountChanged()"></select></div>
      <div id="adminInfo" class="lookup-result"></div>
    </div>

    <div class="admin-grid" style="margin-top:12px">
      <div class="admin-box">
        <h3>🏦 새 계좌 개설</h3>
        <div class="hint" style="margin-bottom:10px">계좌 개설은 관리자 패널에서만 가능해.</div>
        <button class="btn primary full" onclick="openCreateAccount(false)">선택한 사람에게 개설</button>
        <button class="btn full" style="margin-top:8px" onclick="openCreateAccount(true)">새 사람 등록 및 개설</button>
      </div>
      <div class="admin-box">
        <h3>💰 잔액 조정</h3>
        <div class="field"><label>새 잔액 (원)</label><input id="adminBalance" type="number" min="0" step="1"></div>
        <button class="btn primary full" onclick="applyBalance()">잔액 적용</button>
      </div>
      <div class="admin-box">
        <h3>🔐 비밀번호 관리</h3>
        <div class="field"><label>새 계좌 비밀번호</label><input id="adminPassword" type="password" autocomplete="new-password"></div>
        <button class="btn full" onclick="adminChangePassword()">비밀번호 변경</button>
      </div>
      <div class="admin-box">
        <h3>🗑️ 계좌 삭제</h3>
        <div class="hint" style="margin-bottom:10px">선택한 계좌와 해당 거래 내역이 삭제돼.</div>
        <button class="btn danger full" onclick="deleteAccount()">선택 계좌 삭제</button>
      </div>
      <div class="admin-box">
        <h3>📊 은행 전체 현황</h3>
        <div id="bankStats" class="hint"></div>
        <button class="btn full" style="margin-top:10px" onclick="exportData()">백업 파일 만들기</button>
      </div>
      <div class="admin-box">
        <h3>📥 데이터 복원</h3>
        <div class="field"><label>백업 JSON 파일</label><input id="importFile" type="file" accept=".json,application/json"></div>
        <button class="btn full" onclick="importData()">백업 복원</button>
      </div>
    </div>

    <div class="panel" style="margin-top:12px">
      <h3 style="margin-top:0">⚠️ 전체 데이터 초기화</h3>
      <div class="hint" style="margin-bottom:12px">모든 사람, 계좌, 잔액, 거래 내역을 지우고 기본 계좌만 남겨.</div>
      <button class="btn danger full" onclick="resetAll()">전체 데이터 초기화</button>
    </div>
  </main>
</section>

<div id="backdrop" class="modal-backdrop hidden" onclick="backdropClose(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const STORAGE_KEY="virtual_bank_complete_v3";
const ADMIN_PASSWORD="5555000";
let data,personIndex=0,accountIndex=0,adminPersonId=null,adminAccountId=null;
let balanceHidden=false,toastTimer=null,transferRecipient=null;

function uid(){return "id_"+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function digits(v){return String(v??"").replace(/\D/g,"")}
function money(v){return Math.round(Number(v)||0).toLocaleString("ko-KR")+"원"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function now(){return new Date().toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}

function formatNumber(value){
  const d=digits(value);
  if(!d)return "";
  if(d.length<6)return d;
  const patterns={
    6:[2,4],7:[3,4],8:[4,4],9:[3,3,3],10:[3,3,4],
    11:[3,4,4],12:[3,3,6],13:[3,4,3,3],14:[3,3,4,4],
    15:[3,4,4,4],16:[4,4,4,4],17:[3,4,4,3,3],18:[3,3,4,4,4]
  };
  let groups=patterns[d.length];
  if(!groups){
    groups=[];let left=d.length;
    while(left>0){let n=left>4?3:left;groups.push(n);left-=n}
  }
  let pos=0,out=[];
  for(const n of groups){if(pos>=d.length)break;out.push(d.slice(pos,pos+n));pos+=n}
  if(pos<d.length)out.push(d.slice(pos));
  return out.join("-");
}
function generateNumber(){
  const length=[9,10,11,12,13,14,15,16][Math.floor(Math.random()*8)];
  let d="";
  for(let i=0;i<length;i++)d+=Math.floor(Math.random()*10);
  if(d[0]==="0")d="4"+d.slice(1);
  return formatNumber(d);
}
function freshData(){
  return {version:3,colors:{"대한은행":"#6578ee"},people:[{
    id:uid(),name:"강리노",accounts:[{
      id:uid(),bank:"대한은행",number:"482-731-905164",balance:100000,password:"1234",
      history:[{id:uid(),type:"in",title:"계좌 개설",detail:"가상은행 계좌 개설",amount:100000,time:now()}]
    }]
  }]};
}
function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){
      const d=JSON.parse(saved);
      if(d&&Array.isArray(d.people)&&d.people.length){
        d.colors=d.colors||{};
        d.people=d.people.filter(p=>p&&Array.isArray(p.accounts));
        d.people.forEach(p=>{
          p.id=p.id||uid();p.accounts.forEach(a=>{
            a.id=a.id||uid();a.bank=a.bank||"대한은행";
            a.number=formatNumber(a.number||generateNumber());
            a.balance=Math.max(0,Number(a.balance)||0);
            a.password=String(a.password||"1234");
            a.history=Array.isArray(a.history)?a.history:[];
          });
        });
        d.people=d.people.filter(p=>p.accounts.length);
        if(d.people.length)return d;
      }
    }
  }catch(e){}
  const d=freshData();localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;
}
data=loadData();
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function allAccounts(){return data.people.flatMap(p=>p.accounts.map(a=>({person:p,account:a})))}
function person(){return data.people[personIndex]||data.people[0]}
function account(){
  const p=person();
  if(!p.accounts.length)p.accounts.push(makeAccount(p.name,"대한은행",0,"1234"));
  accountIndex=Math.max(0,Math.min(accountIndex,p.accounts.length-1));
  return p.accounts[accountIndex];
}
function makeAccount(name,bank,balance,password,number){
  return {id:uid(),bank:bank||"대한은행",number:formatNumber(number||generateNumber()),
    balance:Number(balance)||0,password:String(password||"1234"),
    history:[{id:uid(),type:"in",title:"계좌 개설",detail:name+"님 계좌 개설",
      amount:Number(balance)||0,time:now()}]};
}
function toast(message){
  const el=document.getElementById("toast");el.textContent=message;el.classList.remove("hidden");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),2700);
}
function bankColor(bank){
  if(data.colors[bank])return data.colors[bank];
  const colors=["#6578ee","#19a77b","#ef8d4c","#9b70dd","#e7658a","#299dc1","#c6a12c","#526d8c","#df6d55","#40a9a1","#8a9b45","#d07db1"];
  const used=Object.values(data.colors),available=colors.filter(c=>!used.includes(c));
  data.colors[bank]=available[0]||colors[Object.keys(data.colors).length%colors.length];
  return data.colors[bank];
}
function render(){
  if(!data.people.length)data=freshData();
  personIndex=Math.max(0,Math.min(personIndex,data.people.length-1));
  const p=person(),a=account();
  document.getElementById("personName").textContent=p.name+"님의 계좌";
  document.getElementById("personMeta").textContent=p.accounts.length+"개 계좌 보유";
  document.getElementById("bankName").textContent=a.bank;
  document.getElementById("bankBall").style.background=bankColor(a.bank);
  document.getElementById("cardOwner").textContent=p.name+"님";
  document.getElementById("accountNumber").textContent=a.number;
  document.getElementById("balance").textContent=balanceHidden?"••••••":money(a.balance);
  document.getElementById("eyeButton").textContent=balanceHidden?"잔액 보기":"잔액 숨기기";
  document.getElementById("accountPosition").textContent=(accountIndex+1)+" / "+p.accounts.length;
  document.getElementById("totalBalance").textContent=balanceHidden?"••••••":money(p.accounts.reduce((s,x)=>s+x.balance,0));
  document.getElementById("totalAccounts").textContent=p.accounts.length+"개";
  renderHistory();save();
}
function renderHistory(){
  const a=account(),filter=document.getElementById("historyFilter").value;
  const query=(document.getElementById("historySearch").value||"").trim().toLowerCase();
  const entries=[...a.history].reverse().filter(h=>{
    const matchesType=filter==="all"||h.type===filter;
    const haystack=[h.title,h.detail,h.time,String(h.amount)].join(" ").toLowerCase();
    return matchesType&&haystack.includes(query);
  });
  document.getElementById("historyList").innerHTML=entries.length?entries.map(h=>{
    const incoming=h.type==="in";
    return `<div class="history-item">
      <div class="history-icon">${incoming?"↙":"↗"}</div>
      <div class="history-main"><div class="history-title">${esc(h.title)}</div>
      <div class="history-sub">${esc(h.detail||"")} · ${esc(h.time||"")}</div></div>
      <div class="history-amount ${incoming?"income":"expense"}">${incoming?"+":"−"}${money(h.amount)}</div>
    </div>`;
  }).join(""):'<div class="empty">검색 결과가 없어.</div>';

function completeTransfer(amount){
  if(!transferRecipient){toast("받는 사람 정보가 없어.");return}
  const sender=account();
  const receiverPerson=data.people.find(p=>p.id===transferRecipient.personId);
  const receiver=receiverPerson?.accounts.find(a=>a.id===transferRecipient.accountId);
  if(!receiver){toast("받는 계좌를 찾을 수 없어.");closeModal();return}
  if(receiver.id===sender.id){toast("자기 자신에게 송금할 수 없어.");closeModal();return}
  if(!Number.isSafeInteger(amount)||amount<=0||amount>sender.balance){toast("잔액이나 송금 금액을 다시 확인해 줘.");return}
  const senderPerson=person(),time=now(),rname=receiverPerson.name;
  sender.balance-=amount;receiver.balance+=amount;
  sender.history.push({id:uid(),type:"out",title:"송금",detail:rname+" · "+receiver.bank+" "+receiver.number,amount,time});
  receiver.history.push({id:uid(),type:"in",title:"송금받기",detail:senderPerson.name+" · "+sender.bank+" "+sender.number,amount,time});
  save();transferRecipient=null;
  openModal(`<div class="transfer-stage" style="text-align:center;padding:12px 0">
    <div class="success-circle">✓</div>
    <h2 style="margin-bottom:8px">송금이 완료됐어!</h2>
    <div style="font-size:14px;color:var(--muted)">${esc(rname)}님에게</div>
    <div style="font-size:32px;font-weight:950;margin:8px 0 18px">${money(amount)}</div>
    <div class="lookup-result" style="text-align:left">
      받는 은행: ${esc(receiver.bank)}<br>받는 계좌: ${esc(receiver.number)}<br>
      송금 시간: ${esc(time)}<br>송금 후 잔액: ${money(sender.balance)}
    </div>
    <button class="btn primary full" style="margin-top:16px" onclick="closeModal();render()">확인</button>
  </div>`);
  render();
}

function createAdminAccount(newPerson){
  const name=document.getElementById("newOwner").value.trim();
  let bank=document.getElementById("newBank").value.trim();
  const raw=document.getElementById("newNumber").value.trim();
  const balance=Number(document.getElementById("newBalance").value);
  const password=document.getElementById("newPassword").value;
  if(!name){toast("계좌 주인 이름을 입력해 줘.");return}
  if(!Number.isSafeInteger(balance)||balance<0){toast("잔액은 0 이상 정수로 입력해 줘.");return}
  if(!password){toast("계좌 비밀번호를 입력해 줘.");return}
  if(!bank)bank=["대한은행","두리은행","수난은행"][Math.floor(Math.random()*3)];
  const number=raw?formatNumber(raw):generateNumber();
  if(!number||digits(number).length<6||digits(number).length>18){toast("계좌번호는 숫자 6~18자리여야 해.");return}
  if(allAccounts().some(x=>digits(x.account.number)===digits(number))){toast("이미 사용 중인 계좌번호야.");return}
  let p;
  if(newPerson){
    p=data.people.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!p){p={id:uid(),name,accounts:[]};data.people.push(p)}
  }else p=selectedAdminPerson();
  if(!p){toast("계좌 주인을 찾을 수 없어.");return}
  const a=makeAccount(name,bank,balance,password,number);
  p.accounts.push(a);adminPersonId=p.id;adminAccountId=a.id;
  personIndex=data.people.findIndex(x=>x.id===p.id);accountIndex=p.accounts.length-1;
  bankColor(bank);save();closeModal();renderAdmin();render();
  toast("계좌 개설 완료! "+a.number);
}
function applyBalance(){
  const a=selectedAdminAccount();if(!a){toast("계좌를 선택해 줘.");return}
  const n=Number(document.getElementById("adminBalance").value);
  if(!Number.isSafeInteger(n)||n<0){toast("잔액을 0 이상 정수로 입력해 줘.");return}
  const diff=n-a.balance;a.balance=n;
  if(diff!==0)a.history.push({id:uid(),type:diff>0?"in":"out",title:"관리자 잔액 조정",
    detail:"관리자 패널에서 변경",amount:Math.abs(diff),time:now()});
  save();renderAdmin();render();toast("잔액을 변경했어.");
}

function deleteAccount(){
  const p=selectedAdminPerson(),a=selectedAdminAccount();
  if(!p||!a){toast("계좌를 선택해 줘.");return}
  if(!confirm(`${p.name}님의 ${a.number} 계좌를 삭제할까?`))return;
  p.accounts=p.accounts.filter(x=>x.id!==a.id);
  if(!p.accounts.length)data.people=data.people.filter(x=>x.id!==p.id);

  personIndex=0;accountIndex=0;save();renderAdmin();render();toast("계좌를 삭제했어.");

  if(!confirm("마지막 확인이야. 정말 초기화할까?"))return;
  data=freshData();personIndex=0;accountIndex=0;
  adminPersonId=data.people[0].id;adminAccountId=data.people[0].accounts[0].id;
  save();renderAdmin();render();toast("초기화 완료.");
}
function exportData(){
  downloadText(JSON.stringify(data,null,2),"가상은행_백업.json","application/json;charset=utf-8");
  toast("백업 파일을 만들었어.");
}
function importData(){
  const file=document.getElementById("importFile").files[0];
  if(!file){toast("복원할 JSON 파일을 선택해 줘.");return}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.people)||!d.people.every(p=>p&&typeof p.name==="string"&&Array.isArray(p.accounts)))throw Error("bad");
      d.people.forEach(p=>p.accounts.forEach(a=>{
        if(!a.bank||!a.number||!Number.isFinite(Number(a.balance)))throw Error("bad");
        a.number=formatNumber(a.number);a.id=a.id||uid();a.password=String(a.password||"1234");
        a.history=Array.isArray(a.history)?a.history:[];
      }));
      if(!d.people.length||!d.people.some(p=>p.accounts.length))throw Error("bad");
      if(!confirm("현재 데이터를 백업 파일의 데이터로 바꿀까?"))return;
      d.colors=d.colors||{};data=d;personIndex=0;accountIndex=0;
      adminPersonId=data.people[0].id;adminAccountId=data.people[0].accounts[0].id;
      save();renderAdmin();render();toast("백업 복원 완료.");
    }catch(e){toast("올바른 가상은행 백업 파일이 아니야.")}
  };
  reader.readAsText(file);
}

data.people.forEach(p=>p.accounts.forEach(a=>{a.number=formatNumber(a.number);bankColor(a.bank)}));
save();render();
</script>
